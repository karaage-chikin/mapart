name: Resource pack gallery images
# rerun after the previous image collection completed without a fast-forward push
# Manual catalogue expansion run: collect up to 3,000 additional recent unique Bedrock entries.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  MAX_MCPEDL_PAGES: "1000"
  MAX_NEW_PACKS: "10000"
  TARGET_TOTAL_PACKS: "10000"
  MAX_ADDITIONAL_PAGES: "260"
  STALE_PAGE_LIMIT: "12"

concurrency:
  group: resource-pack-catalogue
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install structured HTML parser
        run: npm install --no-save --package-lock=false cheerio@1.0.0
      - name: Validate collection scripts and shared helpers
        run: |
          node --check scripts/resource-pack-sync.mjs
          node --check scripts/resource-pack-additional-source.mjs
          node --check scripts/resource-pack-image-enrichment.mjs
          node --check scripts/resource-pack-detail-enrichment.mjs
          node --check scripts/resource-pack-utils.mjs
          node --test scripts/resource-pack-utils.test.mjs
      - name: Sync recent Bedrock resource packs and apply one-calendar-year retention
        run: node scripts/resource-pack-sync.mjs
      - name: Collect recent Bedrock packs from an additional source
        run: node scripts/resource-pack-additional-source.mjs
      - name: Fetch public pack images
        run: node scripts/resource-pack-image-enrichment.mjs
      - name: Collect full descriptions and pack metadata for in-site details
        run: node scripts/resource-pack-detail-enrichment.mjs
      - name: Commit image index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource-packs.json
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Update resource pack gallery images"
            git push
          fi
