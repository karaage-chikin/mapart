name: Expand Bedrock Resource Pack Catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/resource-pack-sync.mjs"
      - "scripts/resource-pack-additional-source.mjs"
      - "scripts/resource-pack-image-enrichment.mjs"
      - "scripts/resource-pack-detail-enrichment.mjs"
      - ".github/workflows/resource-packs-expanded.yml"

permissions:
  contents: write

concurrency:
  group: resource-pack-catalogue
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MAX_MCPEDL_PAGES: "1000"
      MAX_NEW_PACKS: "10000"
      TARGET_TOTAL_PACKS: "10000"
      MAX_ADDITIONAL_PAGES: "1000"
      STALE_PAGE_LIMIT: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install HTML parser
        run: npm install --no-save --package-lock=false cheerio@1.0.0
      - name: Validate collectors and helpers
        run: |
          node --check scripts/resource-pack-sync.mjs
          node --check scripts/resource-pack-additional-source.mjs
          node --check scripts/resource-pack-image-enrichment.mjs
          node --check scripts/resource-pack-detail-enrichment.mjs
          node --check scripts/resource-pack-utils.mjs
          node --test scripts/resource-pack-utils.test.mjs
      - name: Collect recent Bedrock packs
        run: node scripts/resource-pack-sync.mjs
      - name: Collect from additional sources
        run: node scripts/resource-pack-additional-source.mjs
      - name: Fetch descriptions and metadata
        run: node scripts/resource-pack-detail-enrichment.mjs
      - name: Fetch pack gallery images
        run: node scripts/resource-pack-image-enrichment.mjs
      - name: Commit catalogue updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource-packs.json
          if git diff --cached --quiet; then
            echo "No catalogue changes."
          else
            git commit -m "Expand Bedrock resource pack catalogue"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Could not push catalogue after rebasing onto the latest main branch."
            exit 1
          fi
