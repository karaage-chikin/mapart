name: Resource pack gallery images
# rerun after the previous image collection completed without a fast-forward push

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resource-pack-images.yml"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resource-pack-gallery-images
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync up to 900 new Bedrock resource packs and remove entries last updated over one year ago
        run: |
          node <<'NODE'
          import fs from "node:fs";
          const path = "resource-packs.json";
          const packs = JSON.parse(fs.readFileSync(path, "utf8"));
          const cutoff = new Date(Date.now() - 365 * 24 * 60 * 60 * 1000);
          const known = new Map(packs.map(p => [String(p.sourceUrl || "").replace(/\/+$/, "").toLowerCase(), p]));
          const headers = { "User-Agent": "Mozilla/5.0 (compatible; KaraageChikinBedrockPackDirectory/2.1)", "Accept": "text/html,application/xhtml+xml" };
          const clean = s => String(s || "").replace(/<script[\s\S]*?<\/script>/gi, " ").replace(/<style[\s\S]*?<\/style>/gi, " ").replace(/<[^>]*>/g, " ").replace(/&amp;/g, "&").replace(/&#8217;|&#8216;/g, "'").replace(/&quot;/g, '"').replace(/&#160;|&nbsp;/g, " ").replace(/&#8211;/g, "–").replace(/\s+/g, " ").trim();
          const restricted = /\b(gun|guns|weapon|weapons|knife|knives|sword|swords|rifle|pistol|shotgun|grenade|ammo|ammunition|blade|crossbow|mace|spear)\b/i;
          function category(title) {
            const t = title.toLowerCase();
            if (/shader|visual|pbr/.test(t)) return "シェーダー";
            if (/ui|gui|hud|menu|crosshair|inventory/.test(t)) return "UI・テーマ";
            if (/sound|music|audio/.test(t)) return "サウンド";
            if (/font|language/.test(t)) return "言語・フォント";
            if (/animation|animated/.test(t)) return "アニメーション";
            if (/tree|plant|leaves|flower|nature|grass/.test(t)) return "自然・植物";
            if (/block|ore|glass|item|texture/.test(t)) return "ブロック・建築";
            if (/fps|performance|optimization|lag/.test(t)) return "軽量化";
            return "その他";
          }
          async function getPage(page) {
            const url = page === 1 ? "https://mcpedl.com/category/texture-packs/" : "https://mcpedl.com/category/texture-packs/page/" + page + "/";
            const response = await fetch(url, { headers, signal: AbortSignal.timeout(25000) });
            if (!response.ok) throw new Error("MCPEDL listing page " + page + " HTTP " + response.status);
            return await response.text();
          }
          function cardDate(html, index) {
            const articleStart = html.lastIndexOf("<article", index);
            const articleEnd = html.indexOf("</article>", index);
            const region = articleStart >= 0 && articleEnd > index
              ? html.slice(articleStart, articleEnd + 10)
              : html.slice(index, Math.min(html.length, index + 2200));
            const match = region.match(/\b(\d{1,2}\s+[A-Za-z]{3},\s+\d{4})\b/);
            if (!match) return null;
            const date = new Date(match[1]);
            return Number.isNaN(date.getTime()) ? null : date;
          }
          (async () => {
            let added = 0, updated = 0, removed = 0, scanned = 0, reachedOld = false;
            for (let page = 1; page <= 160 && added < 900 && !reachedOld; page++) {
              const html = await getPage(page);
              let pageItems = 0;
              for (const m of html.matchAll(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)) {
                let url;
                try { url = new URL(m[1].replace(/&amp;/g, "&"), "https://mcpedl.com"); } catch { continue; }
                const parts = url.pathname.split("/").filter(Boolean);
                if (url.hostname !== "mcpedl.com" || parts.length !== 1 || /^(category|tag|author|page|wp-json|login|register|search)$/i.test(parts[0])) continue;
                const key = url.origin + url.pathname.replace(/\/+$/, "");
                if (known.has(key.toLowerCase()) && !cardDate(html, m.index)) continue;
                const title = clean(m[2]);
                if (!title || title.length < 3 || title.length > 160 || restricted.test(title)) continue;
                const modified = cardDate(html, m.index);
                if (modified && modified < cutoff) { reachedOld = true; break; }
                if (!modified) continue;
                const sourceUrl = key + "/";
                const near = html.slice(Math.max(0, m.index - 1200), Math.min(html.length, m.index + 2200));
                const img = near.match(/(?:data-src|data-lazy-src|src)=["'](https:\/\/[^"']+\.(?:jpg|jpeg|png|webp)(?:\?[^"']*)?)["']/i);
                const by = near.match(/\bBy\s+([^<·]{2,100})\s*[·<]/i);
                const author = by ? clean(by[1]) : "";
                const image = img?.[1] || "";
                const existing = known.get(key.toLowerCase());
                if (existing) {
                  existing.sourceUpdatedAt = modified.toISOString().slice(0, 10);
                  if (author) existing.author = author;
                  if (image) {
                    existing.thumbnailUrl = existing.thumbnailUrl || image;
                    existing.galleryImages = [...new Set([...(existing.galleryImages || []), image])].slice(0, 8);
                  }
                  updated++;
                  continue;
                }
                const slug = parts[0];
                const id = "mcpedl-" + slug.replace(/[^a-zA-Z0-9_-]/g, "-").slice(0, 56);
                const description = clean(near).slice(0, 700);
                const record = {
                  id, title, author, category: category(title),
                  description: description || "Minecraft Bedrock向けリソースパック。詳細・対応バージョンは配布元ページで確認してください。",
                  sourceUrl, compatibility: "Bedrock向け（配布元でバージョン確認）",
                  source: "MCPEDL", sourceType: "automatic",
                  createdAt: modified.toISOString().slice(0, 10),
                  sourceUpdatedAt: modified.toISOString().slice(0, 10),
                  thumbnailUrl: image, galleryImages: image ? [image] : []
                };
                packs.push(record);
                known.set(key.toLowerCase(), record);
                added++; pageItems++; scanned++;
                if (added >= 900) break;
              }
              console.log("MCPEDL page", page, "new", pageItems, "total new", added);
              if (pageItems === 0 && page > 8 && !reachedOld) {
                // Continue: pages can contain only records already present in the catalogue.
              }
            }
            const before = packs.length;
            const retained = packs.filter(p => {
              if (!p.sourceUpdatedAt) return true;
              const d = new Date(p.sourceUpdatedAt + "T00:00:00Z");
              return Number.isNaN(d.getTime()) || d >= cutoff;
            });
            removed = before - retained.length;
            fs.writeFileSync(path, JSON.stringify(retained, null, 2) + "\n");
            console.log(JSON.stringify({ total: retained.length, added, updated, removed, scanned, cutoff: cutoff.toISOString().slice(0, 10) }, null, 2));
            if (added < 900) console.log("Only " + added + " new unique recent entries were found in the scanned pages.");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Fetch public pack images
        run: |
          node <<'NODE'
          import fs from "node:fs";
          const path = "resource-packs.json";
          const packs = JSON.parse(fs.readFileSync(path, "utf8"));
          const headers = {
            "User-Agent": "Mozilla/5.0 (compatible; ResourcePackGalleryIndexer/1.0)",
            "Accept": "text/html,application/xhtml+xml"
          };
          const decode = s => String(s || "").replace(/&amp;/g, "&").replace(/&#038;/g, "&").replace(/&quot;/g, '"').replace(/&#39;|&#x27;/gi, "'");
          const attr = (tag, name) => {
            const m = tag.match(new RegExp("\\b" + name + "\\s*=\\s*(['\"])(.*?)\\1", "i"));
            return m ? decode(m[2]) : "";
          };
          function extractImages(html) {
            const found = [];
            for (const m of html.matchAll(/<meta\b[^>]*>/gi)) {
              const tag = m[0];
              const key = (attr(tag, "property") || attr(tag, "name")).toLowerCase();
              if (["og:image", "twitter:image", "twitter:image:src"].includes(key)) {
                const value = attr(tag, "content");
                if (value) found.push(value);
              }
            }
            for (const m of html.matchAll(/<img\b[^>]*>/gi)) {
              const tag = m[0];
              const value = attr(tag, "data-src") || attr(tag, "data-lazy-src") || attr(tag, "src");
              if (value) found.push(value);
              const srcset = attr(tag, "srcset");
              if (srcset) found.push(srcset.split(",")[0].trim().split(/\s+/)[0]);
            }
            return [...new Set(found.map(raw => {
              try {
                const u = new URL(raw);
                if (u.protocol !== "https:" || !u.hostname.includes(".") || /\.(svg)(?:$|\?)/i.test(u.pathname)) return "";
                if (/gravatar|overwolf|avatar|logo/i.test(u.hostname + u.pathname)) return "";
                return u.href;
              } catch { return ""; }
            }).filter(Boolean))].slice(0, 8);
          }
          async function fetchOne(pack) {
            if (!/^https:\/\/mcpedl\.com\//i.test(pack.sourceUrl || "")) return { pack, images: [] };
            if (pack.imagesFetchedAt && pack.sourceUpdatedAt && pack.imagesFetchedAt >= pack.sourceUpdatedAt && (pack.galleryImages || []).length) return { pack, images: [] };
            try {
              const response = await fetch(pack.sourceUrl, { headers, signal: AbortSignal.timeout(12000) });
              if (!response.ok) throw new Error("HTTP " + response.status);
              const html = await response.text();
              return { pack, images: extractImages(html.slice(0, 5000000)) };
            } catch (error) {
              console.log("No image:", pack.title, error.message);
              return { pack, images: [] };
            }
          }
          (async () => {
            let updated = 0, totalImages = 0, failed = 0;
            for (let i = 0; i < packs.length; i += 15) {
              const batch = await Promise.all(packs.slice(i, i + 15).map(fetchOne));
              for (const item of batch) {
                if (!item.images.length) { failed++; continue; }
                const combined = [...new Set([...(item.pack.galleryImages || []), ...item.images])].slice(0, 8);
                item.pack.thumbnailUrl = item.pack.thumbnailUrl || combined[0];
                item.pack.galleryImages = combined;
                item.pack.imagesFetchedAt = new Date().toISOString().slice(0, 10);
                updated++;
                totalImages += combined.length;
              }
            }
            fs.writeFileSync(path, JSON.stringify(packs, null, 2) + "\n");
            console.log(JSON.stringify({ scanned: packs.length, updated, totalImages, withoutImages: failed }, null, 2));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit image index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource-packs.json
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Update resource pack gallery images"
            git push
          fi
