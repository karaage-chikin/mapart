<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アイテムドット絵 設置手順</title><style>
:root{color-scheme:dark;--bg:#181825;--panel:#1e1e2e;--card:#313244;--border:#45475a;--text:#cdd6f4;--muted:#a6adc8;--accent:#89b4fa}*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--bg);color:var(--text);font:14px system-ui}main{max-width:1000px;margin:auto}header,.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:9px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.stats{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted)}#map{width:min(100%,420px);aspect-ratio:1;image-rendering:pixelated;border:1px solid var(--border)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.card{background:var(--card);padding:8px;border-radius:8px;text-align:center;min-width:0}.swatch{width:100%;aspect-ratio:1;border-radius:5px;border:1px solid #ffffff33}.name{font-size:.82rem;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:.78rem}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#status{white-space:pre-wrap;color:var(--muted)}.track{height:8px;background:var(--card);border-radius:10px;overflow:hidden;margin:8px 0}.track>div{height:100%;width:0;background:var(--accent)}@media(max-width:520px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><header><b>アイテムドット絵 設置手順</b><button id="copy">この手順のURLをコピー</button></header><section class="panel"><div id="status">設計図を解析しています…</div><div class="stats"><span id="size"></span><span id="count"></span><span id="progress"></span></div><div class="track"><div id="fill"></div></div><h3>全体マップ・現在位置</h3><canvas id="map" width="256" height="256"></canvas><p class="muted" id="position"></p><h3 id="nextTitle">次に置くブロック（8個）</h3><div id="cards" class="cards"></div><div class="controls"><button id="first">最初へ</button><button id="back">前の8個</button><button id="skip">次の段へ</button><button id="next">次の8個</button></div></section></main><script>
(()=>{"use strict";const palette=[{"id":"white_concrete","name":"白色のコンクリート","hex":"#D1D2D3","group":"コンクリート"},{"id":"orange_concrete","name":"橙色のコンクリート","hex":"#E06101","group":"コンクリート"},{"id":"magenta_concrete","name":"赤紫色のコンクリート","hex":"#A9309F","group":"コンクリート"},{"id":"light_blue_concrete","name":"空色のコンクリート","hex":"#2489C7","group":"コンクリート"},{"id":"yellow_concrete","name":"黄色のコンクリート","hex":"#F0AF15","group":"コンクリート"},{"id":"lime_concrete","name":"黄緑色のコンクリート","hex":"#5E7C16","group":"コンクリート"},{"id":"pink_concrete","name":"桃色のコンクリート","hex":"#D5658F","group":"コンクリート"},{"id":"gray_concrete","name":"灰色のコンクリート","hex":"#383B3B","group":"コンクリート"},{"id":"light_gray_concrete","name":"薄灰色のコンクリート","hex":"#7D7D73","group":"コンクリート"},{"id":"cyan_concrete","name":"青緑色のコンクリート","hex":"#157788","group":"コンクリート"},{"id":"purple_concrete","name":"紫色のコンクリート","hex":"#641F9C","group":"コンクリート"},{"id":"blue_concrete","name":"青色のコンクリート","hex":"#253192","group":"コンクリート"},{"id":"brown_concrete","name":"茶色のコンクリート","hex":"#603B1F","group":"コンクリート"},{"id":"green_concrete","name":"緑色のコンクリート","hex":"#495B24","group":"コンクリート"},{"id":"red_concrete","name":"赤色のコンクリート","hex":"#8E2020","group":"コンクリート"},{"id":"black_concrete","name":"黒色のコンクリート","hex":"#080A0F","group":"コンクリート"},{"id":"white_wool","name":"白色の羊毛","hex":"#E9ECEC","group":"羊毛"},{"id":"orange_wool","name":"橙色の羊毛","hex":"#F07613","group":"羊毛"},{"id":"magenta_wool","name":"赤紫色の羊毛","hex":"#BD44B3","group":"羊毛"},{"id":"light_blue_wool","name":"空色の羊毛","hex":"#3AAFD9","group":"羊毛"},{"id":"yellow_wool","name":"黄色の羊毛","hex":"#F8C627","group":"羊毛"},{"id":"lime_wool","name":"黄緑色の羊毛","hex":"#70B919","group":"羊毛"},{"id":"pink_wool","name":"桃色の羊毛","hex":"#ED8DAC","group":"羊毛"},{"id":"gray_wool","name":"灰色の羊毛","hex":"#414141","group":"羊毛"},{"id":"light_gray_wool","name":"薄灰色の羊毛","hex":"#9D9D97","group":"羊毛"},{"id":"cyan_wool","name":"青緑色の羊毛","hex":"#169C9C","group":"羊毛"},{"id":"purple_wool","name":"紫色の羊毛","hex":"#8932B8","group":"羊毛"},{"id":"blue_wool","name":"青色の羊毛","hex":"#35399D","group":"羊毛"},{"id":"brown_wool","name":"茶色の羊毛","hex":"#724728","group":"羊毛"},{"id":"green_wool","name":"緑色の羊毛","hex":"#546D1B","group":"羊毛"},{"id":"red_wool","name":"赤色の羊毛","hex":"#A12722","group":"羊毛"},{"id":"black_wool","name":"黒色の羊毛","hex":"#141519","group":"羊毛"},{"id":"terracotta","name":"テラコッタ","hex":"#985E45","group":"テラコッタ"},{"id":"white_terracotta","name":"白色のテラコッタ","hex":"#D1B1A1","group":"テラコッタ"},{"id":"orange_terracotta","name":"橙色のテラコッタ","hex":"#A15325","group":"テラコッタ"},{"id":"magenta_terracotta","name":"赤紫色のテラコッタ","hex":"#95576C","group":"テラコッタ"},{"id":"light_blue_terracotta","name":"空色のテラコッタ","hex":"#706C8A","group":"テラコッタ"},{"id":"yellow_terracotta","name":"黄色のテラコッタ","hex":"#BA8524","group":"テラコッタ"},{"id":"lime_terracotta","name":"黄緑色のテラコッタ","hex":"#677535","group":"テラコッタ"},{"id":"pink_terracotta","name":"桃色のテラコッタ","hex":"#A14E4E","group":"テラコッタ"},{"id":"gray_terracotta","name":"灰色のテラコッタ","hex":"#392A24","group":"テラコッタ"},{"id":"light_gray_terracotta","name":"薄灰色のテラコッタ","hex":"#876B62","group":"テラコッタ"},{"id":"cyan_terracotta","name":"青緑色のテラコッタ","hex":"#565B5B","group":"テラコッタ"},{"id":"purple_terracotta","name":"紫色のテラコッタ","hex":"#764556","group":"テラコッタ"},{"id":"blue_terracotta","name":"青色のテラコッタ","hex":"#4A3B5B","group":"テラコッタ"},{"id":"brown_terracotta","name":"茶色のテラコッタ","hex":"#4D3324","group":"テラコッタ"},{"id":"green_terracotta","name":"緑色のテラコッタ","hex":"#4C532A","group":"テラコッタ"},{"id":"red_terracotta","name":"赤色のテラコッタ","hex":"#8E3C2E","group":"テラコッタ"},{"id":"black_terracotta","name":"黒色のテラコッタ","hex":"#251610","group":"テラコッタ"}];const $=id=>document.getElementById(id);let w=0,h=0,mode=0,pixels=[],order=[],pos=0,hash=location.hash.slice(1);function decode(s){s=s.replace(/-/g,"+").replace(/_/g,"/");const raw=atob(s+"=".repeat((4-s.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0));}async function load(){const kind=hash.slice(0,2);if(!["3p","3d"].includes(kind))throw Error("設置手順URLが正しくありません。");let bytes=decode(hash.slice(2));if(kind==="3d"){if(!("DecompressionStream"in window))throw Error("このブラウザは圧縮データに対応していません。");bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer());}if(bytes[0]!==77||bytes[1]!==1)throw Error("未対応の設計図です。");mode=bytes[2];w=bytes[3]|(bytes[4]<<8);h=bytes[5]|(bytes[6]<<8);if(!w||!h||w>256||h>256||bytes.length!==8+w*h)throw Error("設計図サイズが不正です。");pixels=Array.from(bytes.slice(8));for(const v of pixels)if(v!==255&&!palette[v])throw Error("未知のブロック番号です。");if(mode===0){for(let y=h-1;y>=0;y--)for(let x=0;x<w;x++){const i=y*w+x;if(pixels[i]!==255)order.push(i);}}else{for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(pixels[i]!==255)order.push(i);}}$("size").textContent=w+" × "+h+" / "+(mode===0?"壁画（下から上）":"地上絵（奥から手前）");$("count").textContent=order.length+"ブロック";$("status").textContent=mode===0?"壁画：最下段から上へ、左から右に8ブロックずつ設置します。":"地上絵：奥側から手前へ、左から右に8ブロックずつ設置します。";draw();}function draw(){const c=$("map").getContext("2d"),cw=256/w,ch=256/h;c.clearRect(0,0,256,256);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=pixels[y*w+x];c.fillStyle=v===255?"#252536":palette[v].hex;c.fillRect(x*cw,y*ch,cw,ch);}for(let n=0;n<pos;n++){const i=order[n],x=i%w,y=Math.floor(i/w);c.fillStyle="#0009";c.fillRect(x*cw,y*ch,cw,ch);}for(let n=pos;n<Math.min(pos+8,order.length);n++){const i=order[n],x=i%w,y=Math.floor(i/w);c.strokeStyle="#ffcf45";c.lineWidth=1.5;c.strokeRect(x*cw+.5,y*ch+.5,Math.max(1,cw-1),Math.max(1,ch-1));}const next=order[pos];$("position").textContent=next===undefined?"すべて設置完了":mode===0?"現在位置："+(next%w+1)+"列目・下から"+(h-Math.floor(next/w))+"段目":"現在位置："+(next%w+1)+"列目・奥から"+(Math.floor(next/w)+1)+"行目";const box=$("cards");box.replaceChildren();for(const i of order.slice(pos,pos+8)){const b=palette[pixels[i]],x=i%w,y=Math.floor(i/w),card=document.createElement("div");card.className="card";const sw=document.createElement("div");sw.className="swatch";sw.style.background=b.hex;const name=document.createElement("div");name.className="name";name.textContent=b.name;const coord=document.createElement("div");coord.className="muted";coord.textContent=mode===0?(x+1)+"列目・下から"+(h-y)+"段目":(x+1)+"列目・奥から"+(y+1)+"行目";card.append(sw,name,coord);box.append(card);}$("progress").textContent=pos+" / "+order.length+"個";$("fill").style.width=(order.length?pos/order.length*100:100)+"%";$("nextTitle").textContent=pos>=order.length?"設置完了！":"次に置くブロック（"+Math.min(8,order.length-pos)+"個）";$("next").disabled=pos>=order.length;$("back").disabled=pos===0;$("skip").disabled=pos>=order.length;}$("next").onclick=()=>{pos=Math.min(order.length,pos+8);draw();};$("back").onclick=()=>{pos=Math.max(0,pos-8);draw();};$("first").onclick=()=>{pos=0;draw();};$("skip").onclick=()=>{if(pos>=order.length)return;const y=Math.floor(order[pos]/w);let next=pos+1;while(next<order.length&&Math.floor(order[next]/w)===y)next++;pos=next;draw();};$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$("status").textContent="設置手順URLをコピーしました。";}catch(e){$("status").textContent="URL欄からコピーしてください。";}};load().catch(e=>{$("status").textContent=e.message||String(e);});})();
</script></body></html>
