<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft MapArt 設計図</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#171717;color:#f2f2f2;font-family:Arial,"Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;background:#242434;border-bottom:1px solid #454558}
h1{font-size:16px;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid #55566a;border-radius:7px;background:#343448;color:#fff;padding:8px 12px;font-size:13px;cursor:pointer}
main{padding:10px;display:flex;justify-content:center;align-items:flex-start}
img{display:block;width:auto;height:auto;max-width:100%;image-rendering:pixelated}
#message{padding:24px;text-align:center;color:#ff8c8c}
small{color:#b8b8cc}
</style>
</head>
<body>
<header><h1>Minecraft MapArt 設計図</h1><div class="actions"><button id="download" disabled>PNGを保存</button><button id="openBuildStep" disabled>設置手順を開く</button><button id="copy">このURLをコピー</button></div></header>
<main><div><div id="message">設計図を読み込んでいます…</div><small id="storageNote">共有リンクはクラウドに保存されます。保存期間は30日です。</small><img id="blueprint" alt="Minecraft MapArt 座標付き設計図" hidden></div></main>
<script src="mapart-shared.js"></script>
<script>
(() => {
  const image = document.getElementById("blueprint");
  const message = document.getElementById("message");
  const download = document.getElementById("download");
  const hash = location.hash.slice(1);
  let buildStepHash = "";
  const stepMatch = hash.match(/(?:^|&)step=((?:[23])?[dp][A-Za-z0-9_-]+)(?:&|$)/);
  if (stepMatch) buildStepHash = stepMatch[1];
  const openBuildStep = document.getElementById("openBuildStep");
  if (buildStepHash) openBuildStep.disabled = false;
  let dataUrl = "";
  const DB_NAME = "mapart-share-v1", STORE = "payloads";
  function openShareDb() { return new Promise((resolve,reject)=>{ const req=indexedDB.open(DB_NAME,1); req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:"id"});}; req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); }); }
  async function readLegacySharedPayload(id) { const db=await openShareDb(); return new Promise((resolve,reject)=>{const req=db.transaction(STORE,"readonly").objectStore(STORE).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);}); }
  const base64ToBytes = value => {
    const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
    const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
    const binary = atob(padded);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  };
  const bytesToDataUrl = bytes => {
    let binary = "";
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
    }
    return "data:image/png;base64," + btoa(binary);
  };

  async function fetchWithTimeout(url, options, timeoutMs) {
    const controller = typeof AbortController === "function" ? new AbortController() : null;
    let timer = null;
    const requestOptions = { ...options };
    if (controller) requestOptions.signal = controller.signal;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => {
        if (controller) controller.abort();
        reject(new Error("クラウド読み込みがタイムアウトしました。通信状態を確認してください。"));
      }, timeoutMs || 25000);
    });
    try { return await Promise.race([fetch(url, requestOptions), timeout]); }
    catch (error) {
      if (error && error.name === "AbortError") throw new Error("クラウド読み込みがタイムアウトしました。通信状態を確認してください。");
      throw error;
    } finally { if (timer !== null) clearTimeout(timer); }
  }
  function validatePngBytes(bytes) {
    if (!(bytes instanceof Uint8Array) || bytes.length < 33 || bytes.length > 1850000) {
      throw new Error("設計図PNGの容量またはデータ長が不正です。");
    }
    const signature = [137,80,78,71,13,10,26,10];
    if (!signature.every((value,index) => bytes[index] === value)) throw new Error("設計図データがPNGとして認識できません。");
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const width = view.getUint32(16, false), height = view.getUint32(20, false);
    if (view.getUint32(8, false) !== 13 || bytes[12] !== 73 || bytes[13] !== 72 || bytes[14] !== 68 || bytes[15] !== 82 ||
        !width || !height || width > 8192 || height > 8192 || width * height > 16777216 || bytes[24] !== 8 || bytes[25] !== 6) {
      throw new Error("PNGのヘッダーまたは画像サイズが不正です。");
    }
  }

  async function loadBlueprint() {
    try {
      let pngBytes;
      const cloudMatch = hash.match(/^id=cloud_([a-f0-9]{32})(?:&step=(?:[23])?[dp][A-Za-z0-9_-]+)?$/);
      const sharedMatch = hash.match(/^id=([a-zA-Z0-9_-]{8,80})$/);
      if (cloudMatch) {
        const response = await fetchWithTimeout("https://mapart-api.karaage-chikin-029.workers.dev/api/blueprints/" + encodeURIComponent(cloudMatch[1]), { cache: "no-store" }, 25000);
        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          throw new Error(result.error || "クラウド上の設計図が見つかりません。リンクの期限切れ、またはURLの誤りを確認してください。");
        }
        if ((response.headers.get("Content-Type") || "").includes("image/png")) {
          pngBytes = new Uint8Array(await response.arrayBuffer());
        } else {
          const result = await response.json().catch(() => ({}));
          if (!result.data) throw new Error(result.error || "クラウド上の設計図データが空です。");
          pngBytes = base64ToBytes(result.data);
        }
      } else if (sharedMatch) {
        const saved = await readLegacySharedPayload(sharedMatch[1]);
        if (!saved || !saved.bytes) throw new Error("旧形式の設計図データが見つかりません。以前に作成した端末・ブラウザで開いてください。");
        pngBytes = new Uint8Array(saved.bytes);
      } else {
        if (!hash) throw new Error("設計図データがURLにありません。元のサイトで「オンラインで表示」を押してください。");
        const rawHash = hash.startsWith("2d") || hash.startsWith("2p") ? hash.slice(1) : hash;
        const mode = rawHash[0] === "d" || rawHash[0] === "p" ? rawHash[0] : "p";
        const payload = base64ToBytes(mode === "p" && rawHash[0] !== "p" && rawHash[0] !== "d" ? rawHash : rawHash.slice(1));
        pngBytes = payload;
        if (mode === "d") {
          if (typeof DecompressionStream !== "function") throw new Error("このブラウザは圧縮URLの展開に対応していません。");
          const stream = new Blob([payload]).stream().pipeThrough(new DecompressionStream("deflate"));
          pngBytes = new Uint8Array(await new Response(stream).arrayBuffer());
        }
      }
      if (cloudMatch && !buildStepHash) {
        try {
          const stepResponse = await fetchWithTimeout("https://mapart-api.karaage-chikin-029.workers.dev/api/blueprints/" + encodeURIComponent(cloudMatch[1]) + "/step", { cache: "no-store" }, 15000);
          const stepResult = await stepResponse.json().catch(() => ({}));
          if (stepResponse.ok && typeof stepResult.step === "string") { buildStepHash = stepResult.step; openBuildStep.disabled = false; }
        } catch (stepError) { console.warn("クラウド設置手順の読み込みに失敗:", stepError); }
      }
      validatePngBytes(pngBytes);
      dataUrl = bytesToDataUrl(pngBytes);
      image.onload = () => { image.hidden = false; message.hidden = true; download.disabled = false; };
      image.onerror = () => { image.hidden = true; download.disabled = true; message.hidden = false; message.textContent = "PNGデータは取得できましたが、画像として表示できませんでした。ファイルが破損している可能性があります。"; };
      image.src = dataUrl;
    } catch (error) { message.textContent = error && error.message ? error.message : "設計図を読み込めませんでした。"; }
  }
  loadBlueprint();
  openBuildStep.addEventListener("click", () => {
    if (!buildStepHash) return;
    const target = new URL("build-step.html", window.location.href);
    window.open(target.href + "#" + buildStepHash, "_blank", "noopener");
  });
  download.addEventListener("click", () => {
    if (!dataUrl) return;
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = "minecraft-mapart-blueprint.png";
    a.click();
  });
  document.getElementById("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      message.hidden = false;
      message.textContent = "URLをコピーしました。";
    } catch (_) {
      message.hidden = false;
      message.textContent = "URL欄からアドレスをコピーしてください。";
    }
  });
})();
</script>
</body>
</html>
