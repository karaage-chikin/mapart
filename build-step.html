<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft MapArt ブロック設置手順</title>
<style>
:root{color-scheme:dark;--bg:#181825;--panel:#1e1e2e;--card:#313244;--border:#45475a;--text:#cdd6f4;--muted:#a6adc8;--accent:#89b4fa}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--text);font:14px "Segoe UI","Hiragino Kaku Gothic ProN",sans-serif}
main{max-width:900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:14px}
h1{font-size:1.25rem;margin:0}
button,select{border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);padding:9px 12px;font-size:.9rem}
button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
#status{color:var(--muted);font-size:.85rem;white-space:pre-line;overflow-wrap:anywhere}
#status.error{color:#ff7777}
.progress{font-weight:700;margin:12px 0 6px}
.track{height:8px;border-radius:20px;background:var(--card);overflow:hidden}
.track>div{height:100%;width:0;background:var(--accent);transition:width .15s}
.settings{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.zoom-title{font-weight:700;margin:14px 0 8px}
.blocks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.block{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:5px}
.texture{width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#555}
.texture img{width:100%;height:100%;display:block;object-fit:cover;image-rendering:pixelated}
.col{font-weight:700;text-align:center;font-size:.9rem}
.coord{text-align:center;color:var(--muted);font-size:.78rem}
.name{text-align:center;overflow-wrap:anywhere;font-size:.82rem}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.controls button.primary{background:var(--accent);color:#15151d;border-color:var(--accent);font-weight:700}
@media(max-width:520px){body{padding:9px}.panel{padding:10px}.blocks{gap:5px}.block{padding:5px}.name{font-size:.72rem}.col{font-size:.78rem}.coord{font-size:.68rem}}
</style>
</head>
<body>
<main>
<header><h1>ブロック設置手順</h1><button id="copyUrl">この手順のURLをコピー</button></header>
<section class="panel">
<div id="status">設計図データを読み込んでいます…</div>
<div class="progress" id="progress">読み込み中…</div>
<div class="track"><div id="progressFill"></div></div>
<div class="settings"><label for="direction">2行目以降の進行方向</label><select id="direction"><option value="left">毎行、左端から右へ</option><option value="right">左右交互（2行目は右端から）</option></select></div>
<div class="zoom-title">今回置く4マス</div>
<div class="blocks" id="blocks"></div>
<div class="controls">
<button id="first" disabled>最初へ</button>
<button id="back" disabled>前へ</button>
<button id="skipRow" disabled>次の行へ（1行飛ばす）</button>
<button id="next" class="primary" disabled>次へ（4ブロック）</button>
</div>
</section>
</main>
<script>
(() => {
"use strict";
const PALETTE=[{"id":"grass_block","name":"草ブロック","mapRgb":[127,178,56]},{"id":"dirt","name":"土","mapRgb":[151,109,77]},{"id":"sand","name":"砂","mapRgb":[247,233,163]},{"id":"red_sand","name":"赤い砂","mapRgb":[216,127,51]},{"id":"gravel","name":"砂利","mapRgb":[112,112,112]},{"id":"andesite","name":"安山岩","mapRgb":[112,112,112]},{"id":"clay","name":"粘土ブロック","mapRgb":[164,168,184]},{"id":"snow","name":"雪ブロック","mapRgb":[255,255,255]},{"id":"packed_ice","name":"氷塊","mapRgb":[160,160,255]},{"id":"blue_ice","name":"青氷","mapRgb":[160,160,255]},{"id":"slime","name":"スライムブロック","mapRgb":[127,178,56]},{"id":"stone","name":"石","mapRgb":[112,112,112]},{"id":"cobblestone","name":"丸石","mapRgb":[112,112,112]},{"id":"granite","name":"花崗岩","mapRgb":[151,109,77]},{"id":"diorite","name":"閃緑岩","mapRgb":[255,252,245]},{"id":"deepslate","name":"深層岩","mapRgb":[100,100,100]},{"id":"cobbled_deepslate","name":"深層岩の丸石","mapRgb":[100,100,100]},{"id":"sandstone","name":"砂岩","mapRgb":[247,233,163]},{"id":"red_sandstone","name":"赤い砂岩","mapRgb":[216,127,51]},{"id":"quartz_block","name":"クォーツブロック","mapRgb":[255,252,245]},{"id":"obsidian","name":"黒曜石","mapRgb":[25,25,25]},{"id":"crying_obsidian","name":"泣く黒曜石","mapRgb":[25,25,25]},{"id":"oak_planks","name":"オークの板材","mapRgb":[143,119,72]},{"id":"birch_planks","name":"シラカバの板材","mapRgb":[247,233,163]},{"id":"jungle_planks","name":"ジャングルの板材","mapRgb":[151,109,77]},{"id":"dark_oak_planks","name":"ダークオークの板材","mapRgb":[102,76,51]},{"id":"crimson_planks","name":"真紅の板材","mapRgb":[148,63,97]},{"id":"warped_planks","name":"歪んだ板材","mapRgb":[58,142,140]},{"id":"white_wool","name":"白色の羊毛","mapRgb":[255,255,255]},{"id":"orange_wool","name":"橙色の羊毛","mapRgb":[216,127,51]},{"id":"magenta_wool","name":"赤紫色の羊毛","mapRgb":[178,76,216]},{"id":"light_blue_wool","name":"空色の羊毛","mapRgb":[102,153,216]},{"id":"yellow_wool","name":"黄色の羊毛","mapRgb":[229,229,51]},{"id":"lime_wool","name":"黄緑色の羊毛","mapRgb":[127,204,25]},{"id":"pink_wool","name":"桃色の羊毛","mapRgb":[242,127,165]},{"id":"gray_wool","name":"灰色の羊毛","mapRgb":[76,76,76]},{"id":"light_gray_wool","name":"薄灰色の羊毛","mapRgb":[153,153,153]},{"id":"cyan_wool","name":"青緑色の羊毛","mapRgb":[76,127,153]},{"id":"purple_wool","name":"紫色の羊毛","mapRgb":[127,63,178]},{"id":"blue_wool","name":"青色の羊毛","mapRgb":[51,76,178]},{"id":"brown_wool","name":"茶色の羊毛","mapRgb":[102,76,51]},{"id":"green_wool","name":"緑色の羊毛","mapRgb":[102,127,51]},{"id":"red_wool","name":"赤色の羊毛","mapRgb":[153,51,51]},{"id":"black_wool","name":"黒色の羊毛","mapRgb":[25,25,25]},{"id":"white_concrete","name":"白色のコンクリート","mapRgb":[255,255,255]},{"id":"orange_concrete","name":"橙色のコンクリート","mapRgb":[216,127,51]},{"id":"magenta_concrete","name":"赤紫色のコンクリート","mapRgb":[178,76,216]},{"id":"light_blue_concrete","name":"空色のコンクリート","mapRgb":[102,153,216]},{"id":"yellow_concrete","name":"黄色のコンクリート","mapRgb":[229,229,51]},{"id":"lime_concrete","name":"黄緑色のコンクリート","mapRgb":[127,204,25]},{"id":"pink_concrete","name":"桃色のコンクリート","mapRgb":[242,127,165]},{"id":"gray_concrete","name":"灰色のコンクリート","mapRgb":[76,76,76]},{"id":"light_gray_concrete","name":"薄灰色のコンクリート","mapRgb":[153,153,153]},{"id":"cyan_concrete","name":"青緑色のコンクリート","mapRgb":[76,127,153]},{"id":"purple_concrete","name":"紫色のコンクリート","mapRgb":[127,63,178]},{"id":"blue_concrete","name":"青色のコンクリート","mapRgb":[51,76,178]},{"id":"brown_concrete","name":"茶色のコンクリート","mapRgb":[102,76,51]},{"id":"green_concrete","name":"緑色のコンクリート","mapRgb":[102,127,51]},{"id":"red_concrete","name":"赤色のコンクリート","mapRgb":[153,51,51]},{"id":"black_concrete","name":"黒色のコンクリート","mapRgb":[25,25,25]},{"id":"terracotta","name":"テラコッタ","mapRgb":[216,127,51]},{"id":"white_terracotta","name":"白色のテラコッタ","mapRgb":[209,177,161]},{"id":"orange_terracotta","name":"橙色のテラコッタ","mapRgb":[159,82,36]},{"id":"magenta_terracotta","name":"赤紫色のテラコッタ","mapRgb":[149,87,108]},{"id":"light_blue_terracotta","name":"空色のテラコッタ","mapRgb":[112,108,138]},{"id":"yellow_terracotta","name":"黄色のテラコッタ","mapRgb":[186,133,36]},{"id":"lime_terracotta","name":"黄緑色のテラコッタ","mapRgb":[103,117,53]},{"id":"pink_terracotta","name":"桃色のテラコッタ","mapRgb":[160,77,78]},{"id":"gray_terracotta","name":"灰色のテラコッタ","mapRgb":[57,41,35]},{"id":"light_gray_terracotta","name":"薄灰色のテラコッタ","mapRgb":[135,107,98]},{"id":"cyan_terracotta","name":"青緑色のテラコッタ","mapRgb":[87,92,92]},{"id":"purple_terracotta","name":"紫色のテラコッタ","mapRgb":[122,73,88]},{"id":"blue_terracotta","name":"青色のテラコッタ","mapRgb":[76,62,92]},{"id":"brown_terracotta","name":"茶色のテラコッタ","mapRgb":[76,50,35]},{"id":"green_terracotta","name":"緑色のテラコッタ","mapRgb":[76,82,42]},{"id":"red_terracotta","name":"赤色のテラコッタ","mapRgb":[142,60,46]},{"id":"black_terracotta","name":"黒色のテラコッタ","mapRgb":[37,22,16]},{"id":"iron_block","name":"鉄ブロック","mapRgb":[167,167,167]},{"id":"gold_block","name":"金ブロック","mapRgb":[250,238,77]},{"id":"diamond_block","name":"ダイヤモンドブロック","mapRgb":[92,219,213]},{"id":"emerald_block","name":"エメラルドブロック","mapRgb":[0,217,58]},{"id":"lapis_block","name":"ラピスラズリブロック","mapRgb":[74,128,255]},{"id":"redstone_block","name":"レッドストーンブロック","mapRgb":[255,0,0]},{"id":"copper_block","name":"銅ブロック","mapRgb":[216,127,51]},{"id":"netherite_block","name":"ネザライトブロック","mapRgb":[25,25,25]},{"id":"netherrack","name":"ネザーラック","mapRgb":[112,2,0]},{"id":"calcite","name":"方解石","mapRgb":[209,177,161]},{"id":"basalt","name":"玄武岩","mapRgb":[25,25,25]},{"id":"blackstone","name":"ブラックストーン","mapRgb":[25,25,25]},{"id":"hay_block","name":"干草の俵","mapRgb":[229,229,51]},{"id":"glowstone","name":"グロウストーン","mapRgb":[247,233,163]},{"id":"magma","name":"マグマブロック","mapRgb":[112,2,0]},{"id":"soul_sand","name":"ソウルサンド","mapRgb":[102,76,51]},{"id":"end_stone","name":"エンドストーン","mapRgb":[247,233,163]},{"id":"amethyst_block","name":"アメジストブロック","mapRgb":[127,63,178]},{"id":"sculk","name":"スカルク","mapRgb":[25,25,25]},{"id":"ancient_debris","name":"古代の残骸","mapRgb":[25,25,25]}];
const SIZE=128, STEP=4, BASE="https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/";
const ALIASES={grass_block:"grass",snow_block:"snow",cobweb:"web",terracotta:"hardened_clay"};
const $=id=>document.getElementById(id);
const status=$("status"),progress=$("progress"),fill=$("progressFill"),blocks=$("blocks");
let indices=null,placed=0, direction="left", images=new Map();
function bytesFromBase64(value){
 const normalized=value.replace(/-/g,"+").replace(/_/g,"/");
 const binary=atob(normalized+"=".repeat((4-normalized.length%4)%4));
 const bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
 return bytes;
}
async function decode(){
 const hash=location.hash.slice(1);
 if(!hash||!["d","p"].includes(hash[0]))throw new Error("URLに設計図データがありません。元のサイトで「設置手順を別タブで開く」を押してください。");
 let bytes=bytesFromBase64(hash.slice(1));
 if(hash[0]==="d"){
  if(typeof DecompressionStream!=="function")throw new Error("このブラウザは圧縮URLの展開に対応していません。");
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  bytes=new Uint8Array(await new Response(stream).arrayBuffer());
 }
 if(bytes.length!==SIZE*SIZE+1)throw new Error("設計図データのサイズが正しくありません。URLが切れていないか確認してください。");
 direction=bytes[0]===1?"right":"left";
 $("direction").value=direction;
 indices=bytes.slice(1);
 for(const n of indices)if(n>=PALETTE.length)throw new Error("未対応のブロック番号が含まれています。");
}
function texturePath(def,terrain){
 if(!def||!def.textures)return null;
 let key=typeof def.textures==="string"?def.textures:(def.textures.up||def.textures.side||def.textures.down);
 const entry=terrain[key];if(!entry)return null;
 let value=entry.textures;if(Array.isArray(value))value=value[0];if(value&&typeof value==="object")value=value.path;
 if(typeof value!=="string")return null;
 return (value.startsWith("textures/")?value:"textures/blocks/"+value)+(value.endsWith(".png")?"":".png");
}
async function loadTextures(){
 status.textContent="統合版のブロックテクスチャ情報を取得しています…";
 const [blocksRes,terrainRes]=await Promise.all([
  fetch(BASE+"blocks.json"),fetch(BASE+"textures/terrain_texture.json")
 ]);
 if(!blocksRes.ok||!terrainRes.ok)throw new Error("公式ブロック定義を取得できませんでした。");
 const blockDefs=JSON.parse((await blocksRes.text()).replace(/^\s*\/\/.*$/gm,""));
 const terrainJson=JSON.parse((await terrainRes.text()).replace(/^\s*\/\/.*$/gm,""));
 const terrain=terrainJson.texture_data||{};
 const used=[...new Set(indices)].map(i=>PALETTE[i]);
 let done=0;
 for(const item of used){
  const path=texturePath(blockDefs[ALIASES[item.id]||item.id],terrain);
  if(path){
   const img=new Image();img.src=BASE+path;
   try{await img.decode();images.set(item.id,img);}catch(_){}
  }
  done++;
  status.textContent="ブロックテクスチャ読み込み中… "+done+" / "+used.length;
 }
 status.textContent="準備完了！表示されたブロックを置いて、次へ進んでください。";
}
function position(order){
 const row=Math.floor(order/SIZE),offset=order%SIZE;
 const reverse=direction==="right"&&row%2===1;
 const x=reverse?SIZE-1-offset:offset;
 return {x,y:row,index:indices[row*SIZE+x]};
}
function draw(){
 const total=SIZE*SIZE,first=Math.min(placed,total),last=Math.min(first+STEP,total);
 progress.textContent=first>=total?"設置完了！ "+total.toLocaleString()+" / "+total.toLocaleString()+" 個":
  "設置済み "+first.toLocaleString()+" / "+total.toLocaleString()+" 個　・　次の4ブロック";
 fill.style.width=(first/total*100)+"%";
 blocks.replaceChildren();
 if(first>=total){
  const done=document.createElement("p");done.textContent="すべてのブロックを置き終わりました！";blocks.append(done);
 }else{
  for(let i=first;i<last;i++){
   const pos=position(i),item=PALETTE[pos.index],card=document.createElement("div");
   card.className="block";
   const texture=document.createElement("div");texture.className="texture";
   const img=images.get(item.id);
   if(img){const copy=document.createElement("img");copy.src=img.src;copy.alt=item.name;texture.append(copy);}
   else texture.style.background="rgb("+item.mapRgb.join(",")+")";
   const col=document.createElement("div");col.className="col";col.textContent=(pos.x+1).toLocaleString()+"列目";
   const coord=document.createElement("div");coord.className="coord";coord.textContent="行"+(pos.y+1);
   const name=document.createElement("div");name.className="name";name.textContent=item.name;
   card.append(texture,col,coord,name);blocks.append(card);
  }
 }
 $("first").disabled=first===0;
 $("back").disabled=first===0;
 $("skipRow").disabled=first>=total||Math.floor(first/SIZE+1)*SIZE>=total;
 $("next").disabled=first>=total;
 $("next").textContent=first+STEP>=total?"完了":"次へ（4ブロック）";
}
function setPosition(value){placed=Math.max(0,Math.min(SIZE*SIZE,Math.floor(value/STEP)*STEP));draw();}
$("first").addEventListener("click",()=>setPosition(0));
$("back").addEventListener("click",()=>setPosition(placed-STEP));
$("next").addEventListener("click",()=>setPosition(placed+STEP));
$("skipRow").addEventListener("click",()=>setPosition(Math.ceil((placed+1)/SIZE)*SIZE));
$("direction").addEventListener("change",()=>{direction=$("direction").value;draw();});
$("copyUrl").addEventListener("click",async()=>{
 try{await navigator.clipboard.writeText(location.href);status.textContent="この設置手順のURLをコピーしました。";}
 catch(_){status.textContent="URL欄からアドレスをコピーしてください。";}
});
(async()=>{try{await decode();await loadTextures();draw();}catch(e){status.className="error";status.textContent=e.message;progress.textContent="読み込みエラー";}})();
})();
</script>
</body>
</html>
