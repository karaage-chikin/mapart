name: Resource pack gallery images
# rerun after the previous image collection completed without a fast-forward push

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resource-pack-images.yml"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resource-pack-gallery-images
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Add up to 500 new Bedrock resource packs
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "resource-packs.json";
          const packs = JSON.parse(fs.readFileSync(path, "utf8"));
          const known = new Set(packs.map(p => String(p.sourceUrl || "").replace(/\/+$/, "")));
          const headers = {
            "User-Agent": "Mozilla/5.0 (compatible; KaraageChikinBedrockPackDirectory/1.0)",
            "Accept": "application/json"
          };
          const clean = s => String(s || "").replace(/<[^>]*>/g, " ").replace(/&amp;/g, "&").replace(/&#8217;|&#8216;/g, "'").replace(/&quot;/g, '"').replace(/&#160;|&nbsp;/g, " ").replace(/\s+/g, " ").trim();
          function category(title, desc) {
            const t = (title + " " + desc).toLowerCase();
            if (/shader|vibrant visual|pbr|lighting/.test(t)) return "シェーダー";
            if (/ui|gui|hud|menu|crosshair|inventory|touch control/.test(t)) return "UI・テーマ";
            if (/sound|music|audio/.test(t)) return "サウンド";
            if (/font|language|translation/.test(t)) return "言語・フォント";
            if (/animation|animated/.test(t)) return "アニメーション";
            if (/tree|plant|leaves|flower|nature|grass/.test(t)) return "自然・植物";
            if (/block|ore|glass|item|texture/.test(t)) return "ブロック・建築";
            if (/low.?end|fps|performance|optimization|lag/.test(t)) return "軽量化";
            return "その他";
          }
          function imagesFromPost(post) {
            const found = [];
            const featured = post._embedded?.["wp:featuredmedia"]?.[0]?.source_url;
            if (featured) found.push(featured);
            const html = String(post.content?.rendered || "");
            for (const m of html.matchAll(/<img\b[^>]*>/gi)) {
              const tag = m[0];
              const src = tag.match(/\b(?:data-src|data-lazy-src|src)=["']([^"']+)["']/i)?.[1];
              if (src) found.push(src.replace(/&amp;/g, "&"));
            }
            return [...new Set(found.map(raw => {
              try {
                const u = new URL(raw);
                if (u.protocol !== "https:" || /\.(svg)(?:$|\?)/i.test(u.pathname)) return "";
                if (/gravatar|avatar|logo|icon/i.test(u.hostname + u.pathname)) return "";
                return u.href;
              } catch { return ""; }
            }).filter(Boolean))].slice(0, 8);
          }
          async function fetchPage(categoryId, page) {
            const url = "https://mcpedl.com/wp-json/wp/v2/posts?categories=" + categoryId +
              "&per_page=100&page=" + page + "&orderby=date&order=desc&_embed=author,wp:featuredmedia";
            let last;
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                const r = await fetch(url, { headers, signal: AbortSignal.timeout(25000) });
                if (r.status === 400) return { posts: [], totalPages: page - 1, done: true };
                if (!r.ok) throw new Error("HTTP " + r.status);
                return { posts: await r.json(), totalPages: Number(r.headers.get("X-WP-TotalPages") || 1), done: false };
              } catch (e) {
                last = e;
                await new Promise(resolve => setTimeout(resolve, 1500 * (attempt + 1)));
              }
            }
            throw last;
          }
          (async () => {
            const cr = await fetch("https://mcpedl.com/wp-json/wp/v2/categories?slug=texture-packs", { headers, signal: AbortSignal.timeout(20000) });
            if (!cr.ok) throw new Error("MCPEDL category API failed: HTTP " + cr.status);
            const cats = await cr.json();
            const categoryId = cats?.[0]?.id;
            if (!categoryId) throw new Error("MCPEDL Bedrock texture-pack category not found");
            let added = 0, scanned = 0, page = 1, totalPages = 1;
            const maxPages = 20;
            while (added < 500 && page <= totalPages && page <= maxPages) {
              const result = await fetchPage(categoryId, page);
              if (result.done || !result.posts.length) break;
              totalPages = result.totalPages;
              scanned += result.posts.length;
              for (const post of result.posts) {
                const link = String(post.link || "").replace(/\/+$/, "");
                let valid = false;
                try { const u = new URL(link); valid = u.protocol === "https:" && u.hostname === "mcpedl.com"; } catch {}
                const title = clean(post.title?.rendered);
                const description = clean(post.excerpt?.rendered || post.content?.rendered).slice(0, 1000);
                if (!valid || !title || known.has(link)) continue;
                const galleryImages = imagesFromPost(post);
                const id = "mcpedl-" + String(post.id || post.slug || added).replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 48);
                packs.push({
                  id, title,
                  author: clean(post._embedded?.author?.[0]?.name || ""),
                  category: category(title, description),
                  description: description || "詳細・対応バージョンは配布元ページで確認してください。",
                  sourceUrl: link + "/",
                  compatibility: "Bedrock向け（配布元でバージョン確認）",
                  source: "MCPEDL",
                  sourceType: "automatic",
                  createdAt: post.date || new Date().toISOString().slice(0, 10),
                  thumbnailUrl: galleryImages[0] || "",
                  galleryImages
                });
                known.add(link);
                added++;
                if (added >= 500) break;
              }
              console.log("MCPEDL page", page, "scanned", scanned, "new", added, "of", totalPages);
              page++;
            }
            fs.writeFileSync(path, JSON.stringify(packs, null, 2) + "\n");
            console.log(JSON.stringify({ previousAndNewTotal: packs.length, added, scanned, pagesRead: page - 1 }, null, 2));
            if (added === 0) console.log("No new resource packs were found; existing catalogue was retained.");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Fetch public pack images
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "resource-packs.json";
          const packs = JSON.parse(fs.readFileSync(path, "utf8"));
          const headers = {
            "User-Agent": "Mozilla/5.0 (compatible; ResourcePackGalleryIndexer/1.0)",
            "Accept": "text/html,application/xhtml+xml"
          };
          const decode = s => String(s || "").replace(/&amp;/g, "&").replace(/&#038;/g, "&").replace(/&quot;/g, '"').replace(/&#39;|&#x27;/gi, "'");
          const attr = (tag, name) => {
            const m = tag.match(new RegExp("\\b" + name + "\\s*=\\s*(['\"])(.*?)\\1", "i"));
            return m ? decode(m[2]) : "";
          };
          function extractImages(html) {
            const found = [];
            for (const m of html.matchAll(/<meta\b[^>]*>/gi)) {
              const tag = m[0];
              const key = (attr(tag, "property") || attr(tag, "name")).toLowerCase();
              if (["og:image", "twitter:image", "twitter:image:src"].includes(key)) {
                const value = attr(tag, "content");
                if (value) found.push(value);
              }
            }
            for (const m of html.matchAll(/<img\b[^>]*>/gi)) {
              const tag = m[0];
              const value = attr(tag, "data-src") || attr(tag, "data-lazy-src") || attr(tag, "src");
              if (value) found.push(value);
              const srcset = attr(tag, "srcset");
              if (srcset) found.push(srcset.split(",")[0].trim().split(/\s+/)[0]);
            }
            return [...new Set(found.map(raw => {
              try {
                const u = new URL(raw);
                if (u.protocol !== "https:" || !u.hostname.includes(".") || /\.(svg)(?:$|\?)/i.test(u.pathname)) return "";
                if (/gravatar|overwolf|avatar|logo/i.test(u.hostname + u.pathname)) return "";
                return u.href;
              } catch { return ""; }
            }).filter(Boolean))].slice(0, 8);
          }
          async function fetchOne(pack) {
            if (!/^https:\/\/mcpedl\.com\//i.test(pack.sourceUrl || "")) return { pack, images: [] };
            try {
              const response = await fetch(pack.sourceUrl, { headers, signal: AbortSignal.timeout(18000) });
              if (!response.ok) throw new Error("HTTP " + response.status);
              const html = await response.text();
              return { pack, images: extractImages(html.slice(0, 5000000)) };
            } catch (error) {
              console.log("No image:", pack.title, error.message);
              return { pack, images: [] };
            }
          }
          (async () => {
            let updated = 0, totalImages = 0, failed = 0;
            for (let i = 0; i < packs.length; i += 5) {
              const batch = await Promise.all(packs.slice(i, i + 5).map(fetchOne));
              for (const item of batch) {
                if (!item.images.length) { failed++; continue; }
                const combined = [...new Set([...(item.pack.galleryImages || []), ...item.images])].slice(0, 8);
                item.pack.thumbnailUrl = item.pack.thumbnailUrl || combined[0];
                item.pack.galleryImages = combined;
                updated++;
                totalImages += combined.length;
              }
            }
            fs.writeFileSync(path, JSON.stringify(packs, null, 2) + "\n");
            console.log(JSON.stringify({ scanned: packs.length, updated, totalImages, withoutImages: failed }, null, 2));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit image index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource-packs.json
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Update resource pack gallery images"
            git push
          fi
