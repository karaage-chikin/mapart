<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アイテムドット絵 オンライン設計図</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#181825;color:#cdd6f4;font:14px system-ui;padding:12px}header{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:#1e1e2e;padding:12px;border-radius:10px}button{background:#313244;color:#cdd6f4;border:1px solid #45475a;border-radius:7px;padding:9px;cursor:pointer}main{max-width:1100px;margin:14px auto;text-align:center}.art{max-width:min(92vw,900px);height:auto;image-rendering:pixelated;border:1px solid #45475a}.muted{color:#a6adc8}#message{padding:20px;white-space:pre-wrap}</style></head><body><header><b>アイテムドット絵 オンライン設計図</b><div><button id="step" disabled>設置手順を開く</button> <button id="copy">URLをコピー</button></div></header><main><div id="message">設計図を読み込んでいます…</div><img id="art" class="art" hidden alt="ブロック設計図"><p class="muted" id="info"></p></main><script>(()=>{"use strict";const $=id=>document.getElementById(id),hash=location.hash.slice(1);let stepHash="";async function run(){try{const m=hash.match(/^id=cloud_([a-f0-9]{32})&step=(3[dp][A-Za-z0-9_-]+)$/);if(!m)throw Error("URLが正しくありません。");stepHash=m[2];const r=await fetch("https://mapart-api.karaage-chikin-029.workers.dev/api/blueprints/"+m[1],{cache:"no-store"});if(!r.ok)throw Error("クラウド設計図を取得できません（HTTP "+r.status+"）。");let blob;if((r.headers.get("Content-Type")||"").includes("image/png"))blob=await r.blob();else{const j=await r.json(),raw=atob(j.data);blob=new Blob([Uint8Array.from(raw,c=>c.charCodeAt(0))],{type:"image/png"});}const img=$("art");img.src=URL.createObjectURL(blob);img.hidden=false;$("message").hidden=true;$("info").textContent="共有リンクの有効期限は30日です。";$("step").disabled=false;}catch(e){$("message").textContent=e.message||String(e);}}$("step").onclick=()=>location.href="3d-build-step.html#"+stepHash;$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$("message").hidden=false;$("message").textContent="URLをコピーしました。";}catch(e){$("message").textContent="ブラウザのURL欄からコピーしてください。";}};run();})();</script></body></html>
