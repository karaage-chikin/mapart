<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft MapArt 設計図</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#171717;color:#f2f2f2;font-family:Arial,"Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;background:#242434;border-bottom:1px solid #454558}
h1{font-size:16px;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid #55566a;border-radius:7px;background:#343448;color:#fff;padding:8px 12px;font-size:13px;cursor:pointer}
main{padding:10px;display:flex;justify-content:center;align-items:flex-start}
img{display:block;width:auto;height:auto;max-width:100%;image-rendering:pixelated}
#message{padding:24px;text-align:center;color:#ff8c8c}
small{color:#b8b8cc}
</style>
</head>
<body>
<header><h1>Minecraft MapArt 設計図</h1><div class="actions"><button id="download" disabled>PNGを保存</button><button id="copy">このURLをコピー</button></div></header>
<main><div id="message">設計図を読み込んでいます…</div><img id="blueprint" alt="Minecraft MapArt 座標付き設計図" hidden></main>
<script src="mapart-shared.js"></script>
<script>
(() => {
  const image = document.getElementById("blueprint");
  const message = document.getElementById("message");
  const download = document.getElementById("download");
  const hash = location.hash.slice(1);
  let dataUrl = "";
  const base64ToBytes = value => {
    const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
    const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
    const binary = atob(padded);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  };
  const bytesToDataUrl = bytes => {
    let binary = "";
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
    }
    return "data:image/png;base64," + btoa(binary);
  };
  const DB_NAME = "mapart-share-v1", STORE = "payloads";
  function openShareDb() { return new Promise((resolve,reject)=>{ const req=indexedDB.open(DB_NAME,1); req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:"id"});}; req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); }); }
  async function readSharedPayload(id) { const db=await openShareDb(); return new Promise((resolve,reject)=>{const req=db.transaction(STORE,"readonly").objectStore(STORE).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);}); }
  async function loadBlueprint() {
    try {
      let pngBytes;
      const sharedMatch = hash.match(/^id=([a-zA-Z0-9_-]{8,80})$/);
      if (sharedMatch) {
        const saved = await readSharedPayload(sharedMatch[1]);
        if (!saved || !saved.bytes) throw new Error("設計図データが見つかりません。このURLを作成したブラウザと同じ端末・ブラウザで開いてください。");
        pngBytes = new Uint8Array(saved.bytes);
      } else {
        if (!hash) throw new Error("設計図データがURLにありません。元のサイトで「オンラインで表示」を押してください。");
        const rawHash = hash.startsWith("2d") || hash.startsWith("2p") ? hash.slice(1) : hash;
        const mode = rawHash[0] === "d" || rawHash[0] === "p" ? rawHash[0] : "p";
        const payload = base64ToBytes(mode === "p" && rawHash[0] !== "p" && rawHash[0] !== "d" ? rawHash : rawHash.slice(1));
        pngBytes = payload;
        if (mode === "d") {
          if (typeof DecompressionStream !== "function") throw new Error("このブラウザは圧縮URLの展開に対応していません。");
          const stream = new Blob([payload]).stream().pipeThrough(new DecompressionStream("deflate"));
          pngBytes = new Uint8Array(await new Response(stream).arrayBuffer());
        }
      }
      if (pngBytes.length < 8 || pngBytes[0] !== 137 || pngBytes[1] !== 80 || pngBytes[2] !== 78 || pngBytes[3] !== 71) throw new Error("設計図データがPNGとして認識できません。");
      dataUrl = bytesToDataUrl(pngBytes);
      image.onload = () => { image.hidden = false; message.hidden = true; download.disabled = false; };
      image.onerror = () => { message.textContent = "設計図を読み込めませんでした。"; };
      image.src = dataUrl;
    } catch (error) { message.textContent = error && error.message ? error.message : "設計図を読み込めませんでした。"; }
  }
  loadBlueprint();
  download.addEventListener("click", () => {
    if (!dataUrl) return;
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = "minecraft-mapart-blueprint.png";
    a.click();
  });
  document.getElementById("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      message.hidden = false;
      message.textContent = "URLをコピーしました。";
    } catch (_) {
      message.hidden = false;
      message.textContent = "URL欄からアドレスをコピーしてください。";
    }
  });
})();
</script>
</body>
</html>
