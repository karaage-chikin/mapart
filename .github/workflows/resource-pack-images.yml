name: Resource pack gallery images
# rerun after the previous image collection completed without a fast-forward push
# Manual catalogue expansion run: collect up to 3,000 additional recent unique Bedrock entries.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resource-pack-images.yml"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resource-pack-gallery-images
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync up to 3,000 new Bedrock resource packs and remove entries last updated over one year ago
        run: |
          node <<'NODE'
          import fs from "node:fs";
          const path = "resource-packs.json";
          const packs = JSON.parse(fs.readFileSync(path, "utf8"));
          const cutoff = new Date(Date.now() - 365 * 24 * 60 * 60 * 1000);
          const known = new Map(packs.map(p => [String(p.sourceUrl || "").replace(/\/+$/, "").toLowerCase(), p]));
          const headers = { "User-Agent": "Mozilla/5.0 (compatible; KaraageChikinBedrockPackDirectory/2.1)", "Accept": "text/html,application/xhtml+xml" };
          const clean = s => String(s || "").replace(/<script[\s\S]*?<\/script>/gi, " ").replace(/<style[\s\S]*?<\/style>/gi, " ").replace(/<[^>]*>/g, " ").replace(/&amp;/g, "&").replace(/&#8217;|&#8216;/g, "'").replace(/&quot;/g, '"').replace(/&#160;|&nbsp;/g, " ").replace(/&#8211;/g, "–").replace(/\s+/g, " ").trim();
          const restricted = /\b(gun|guns|weapon|weapons|knife|knives|sword|swords|rifle|pistol|shotgun|grenade|ammo|ammunition|blade|crossbow|mace|spear)\b/i;
          const unsafeAtStart = packs.length;
          for (let i = packs.length - 1; i >= 0; i--) {
            if (restricted.test(String(packs[i].title || "") + " " + String(packs[i].sourceUrl || "") + " " + String(packs[i].description || ""))) packs.splice(i, 1);
          }
          console.log("Excluded restricted-topic entries:", unsafeAtStart - packs.length);
          function category(title) {
            const t = title.toLowerCase();
            if (/shader|visual|pbr/.test(t)) return "シェーダー";
            if (/ui|gui|hud|menu|crosshair|inventory/.test(t)) return "UI・テーマ";
            if (/sound|music|audio/.test(t)) return "サウンド";
            if (/font|language/.test(t)) return "言語・フォント";
            if (/animation|animated/.test(t)) return "アニメーション";
            if (/tree|plant|leaves|flower|nature|grass/.test(t)) return "自然・植物";
            if (/block|ore|glass|item|texture/.test(t)) return "ブロック・建築";
            if (/fps|performance|optimization|lag/.test(t)) return "軽量化";
            return "その他";
          }
          async function getPage(page) {
            const url = page === 1
              ? "https://mcpedl.com/category/texture-packs/"
              : "https://mcpedl.com/category/texture-packs/page/" + page + "/";
            const response = await fetch(url, { headers, signal: AbortSignal.timeout(25000) });
            if (!response.ok) throw new Error("MCPEDL listing page " + page + " HTTP " + response.status);
            return await response.text();
          }
          function cardDate(html, index) {
            const before = html.slice(Math.max(0, index - 1800), index);
            const after = html.slice(index, Math.min(html.length, index + 1800));
            const datesBefore = [...before.matchAll(/\b(\d{1,2}\s+[A-Za-z]{3},\s+\d{4})\b/g)];
            const raw = datesBefore.length ? datesBefore[datesBefore.length - 1][1] : after.match(/\b(\d{1,2}\s+[A-Za-z]{3},\s+\d{4})\b/)?.[1];
            if (!raw) return null;
            const date = new Date(raw);
            return Number.isNaN(date.getTime()) ? null : date;
          }
          (async () => {
            let added = 0, updated = 0, removed = 0, scanned = 0, reachedOld = false, stalePages = 0;
            for (let page = 1; page <= 1000 && added < 3000 && !reachedOld; page++) {
              const html = await getPage(page);
              let pageItems = 0, pageChanges = 0;
              for (const m of html.matchAll(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)) {
                let url;
                try { url = new URL(m[1].replace(/&amp;/g, "&"), "https://mcpedl.com"); } catch { continue; }
                const parts = url.pathname.split("/").filter(Boolean);
                if (url.hostname !== "mcpedl.com" || parts.length !== 1 || /^(category|tag|author|page|wp-json|login|register|search)$/i.test(parts[0])) continue;
                const key = url.origin + url.pathname.replace(/\/+$/, "");
                const title = clean(m[2]);
                if (!title || title.length < 4 || title.length > 160 || /^\d+(?:\.\d+)?$/.test(title) || /^image$/i.test(title)) continue;
                if (restricted.test(title + " " + key)) continue;
                const modified = cardDate(html, m.index);
                if (modified && modified < cutoff) { reachedOld = true; break; }
                const existing = known.get(key.toLowerCase());
                if (existing) {
                  let changed = false;
                  if (existing.title !== title) { existing.title = title; existing.category = category(title); changed = true; }
                  if (modified) {
                    const dateText = modified.toISOString().slice(0, 10);
                    if (existing.sourceUpdatedAt !== dateText) { existing.sourceUpdatedAt = dateText; changed = true; }
                  }
                  if (existing.sourceType === "automatic") {
                    existing.description = "Minecraft Bedrock向けリソースパック。詳細・対応バージョンは配布元ページで確認してください。";
                    existing.compatibility = "Bedrock向け（配布元でバージョン確認）";
                  }
                  if (changed) { updated++; pageChanges++; }
                  continue;
                }
                if (!modified) continue;
                const slug = parts[0];
                const id = "mcpedl-" + slug.replace(/[^a-zA-Z0-9_-]/g, "-").slice(0, 56);
                const record = {
                  id, title, author: "", category: category(title),
                  description: "Minecraft Bedrock向けリソースパック。詳細・対応バージョンは配布元ページで確認してください。",
                  sourceUrl: key + "/", compatibility: "Bedrock向け（配布元でバージョン確認）",
                  source: "MCPEDL", sourceType: "automatic",
                  createdAt: modified.toISOString().slice(0, 10),
                  sourceUpdatedAt: modified.toISOString().slice(0, 10),
                  thumbnailUrl: "", galleryImages: []
                };
                packs.push(record);
                known.set(key.toLowerCase(), record);
                added++; pageItems++; pageChanges++; scanned++;
                if (added >= 3000) break;
              }
              console.log("MCPEDL page", page, "new", pageItems, "changed", pageChanges, "total new", added);
              stalePages = pageChanges === 0 ? stalePages + 1 : 0;
              if (stalePages >= 12) break;
            }
            const before = packs.length;
            const retained = packs.filter(p => {
              const title = String(p.title || "");
              const sourceUrl = String(p.sourceUrl || "");
              if (restricted.test(title + " " + sourceUrl + " " + String(p.description || ""))) return false;
              if (p.sourceType === "automatic" && (!title || /^\d+(?:\.\d+)?$/.test(title) || /^image$/i.test(title))) return false;
              if (!p.sourceUpdatedAt) return true;
              const d = new Date(p.sourceUpdatedAt + "T00:00:00Z");
              return Number.isNaN(d.getTime()) || d >= cutoff;
            });
            removed = before - retained.length;
            fs.writeFileSync(path, JSON.stringify(retained, null, 2) + "\n");
            console.log(JSON.stringify({ total: retained.length, added, updated, removed, scanned, directDownloadable: retained.filter(p => p.directDownloadAllowed && p.directDownloadUrl).length, cutoff: cutoff.toISOString().slice(0, 10) }, null, 2));
            if (added < 900) console.log("Only " + added + " new unique recent entries were found in the scanned pages.");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Collect recent Bedrock packs from an additional source
        run: |
          node <<'NODE'
          import fs from "node:fs";
          const file = "resource-packs.json";
          const packs = JSON.parse(fs.readFileSync(file, "utf8"));
          const cutoff = new Date(Date.now() - 365 * 86400000);
          const urls = new Set(packs.map(p => String(p.sourceUrl || "").replace(/\/+$/, "").toLowerCase()));
          const titles = new Set(packs.map(p => titleKey(p.title)));
          const blocked = /\b(gun|guns|weapon|weapons|knife|knives|sword|swords|rifle|pistol|shotgun|grenade|ammo|ammunition|blade|crossbow|mace|spear)\b/i;
          const headers = { "User-Agent": "Mozilla/5.0 (compatible; KaraageChikinBedrockPackDirectory/3.0)", "Accept": "text/html,application/xhtml+xml" };
          function clean(s) { return String(s || "").replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<style[\s\S]*?<\/style>/gi," ").replace(/<[^>]*>/g," ").replace(/&amp;|&#038;/g,"&").replace(/&quot;/g,'"').replace(/&#39;|&#x27;|&#8217;|&#8216;/gi,"'").replace(/&nbsp;|&#160;/gi," ").replace(/&#8211;/g,"–").replace(/\s+/g," ").trim(); }
          function titleKey(s) { return clean(s).toLowerCase().replace(/[^a-z0-9ぁ-んァ-ヶ一-龯]/gi,""); }
          function category(t) { t=t.toLowerCase(); if(/shader|visual|pbr/.test(t))return "シェーダー"; if(/ui|gui|hud|menu|inventory/.test(t))return "UI・テーマ"; if(/sound|music|audio/.test(t))return "サウンド"; if(/font|language/.test(t))return "言語・フォント"; if(/animation/.test(t))return "アニメーション"; if(/tree|plant|leaves|flower|nature|grass/.test(t))return "自然・植物"; if(/block|ore|glass|item|texture/.test(t))return "ブロック・建築"; if(/fps|performance|optimization|lag/.test(t))return "軽量化"; return "その他"; }
          function attr(tag,n) { const m=tag.match(new RegExp("\\b"+n+"\\s*=\\s*(['\"])(.*?)\\1","i")); return m?m[2].replace(/&amp;/g,"&"):""; }
          function dateFrom(raw) { if(!raw)return null; const d=new Date(raw); return Number.isNaN(d.getTime())?null:d; }
          function cardDate(html) {
            const ds=[];
            for(const m of html.matchAll(/\b(?:datetime|data-date|data-published)=["']([^"']+)["']/gi)){const d=dateFrom(m[1]);if(d)ds.push(d);}
            for(const m of html.matchAll(/\b(?:[A-Za-z]{3,9}\s+\d{1,2},\s+\d{4}|\d{1,2}\s+[A-Za-z]{3},\s+\d{4}|\d{1,2}\/\d{1,2}\/\d{2,4}|\d{4}-\d{2}-\d{2})\b/g)){const d=dateFrom(m[0]);if(d)ds.push(d);}
            return ds.filter(d=>d<=new Date(Date.now()+86400000)).sort((a,b)=>b-a)[0]||null;
          }
          function imageFrom(html,base) {
            for(const m of html.matchAll(/<img\b[^>]*>/gi)){const t=m[0],raw=attr(t,"data-src")||attr(t,"data-lazy-src")||attr(t,"src")||attr(t,"srcset").split(",")[0].trim().split(/\s+/)[0];if(!raw)continue;try{const u=new URL(raw,base);if(u.protocol==="https:"&&!/\.svg(?:$|\?)/i.test(u.pathname)&&!/avatar|gravatar|logo|overwolf/i.test(u.hostname+u.pathname))return u.href;}catch{}}
            return "";
          }
          function descriptionFrom(html,title) { for(const m of html.matchAll(/<p\b[^>]*>([\s\S]*?)<\/p>/gi)){const s=clean(m[1]);if(s.length>35&&s.toLowerCase()!==title.toLowerCase())return s.slice(0,600);}return "Minecraft Bedrock Edition向けのリソースパックです。詳しい機能と対応バージョンは配布元ページで確認してください。"; }
          function authorFrom(html) { const s=clean(html),m=s.match(/\bBy\s+([A-Za-z0-9_. -]{2,60}?)(?=\s+(?:Updated|Last updated|Downloads|Views|$))/i);return m?m[1].trim().slice(0,100):""; }
          function add(provider,href,title,fragment,base) {
            title=clean(title).slice(0,160); if(!title||title.length<4)return false;
            const description=descriptionFrom(fragment,title);if(blocked.test(title+" "+href+" "+description))return false;
            const tk=titleKey(title);if(!tk||titles.has(tk))return false;
            let u;try{u=new URL(href,base);}catch{return false;}if(u.protocol!=="https:")return false;u.hash="";u.search="";
            const canonical=u.origin+u.pathname.replace(/\/+$/,"");if(urls.has(canonical.toLowerCase()))return false;
            const updated=cardDate(fragment);if(!updated||updated<cutoff)return false;
            const date=updated.toISOString().slice(0,10),image=imageFrom(fragment,base),slug=canonical.split("/").filter(Boolean).at(-1)||"pack";
            packs.push({id:provider.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+slug.replace(/[^a-z0-9_-]/gi,"-").slice(0,56),title,author:authorFrom(fragment),category:category(title),description,sourceUrl:canonical+"/",compatibility:"Bedrock向け（配布元でバージョン確認）",source:provider,sourceType:"automatic",createdAt:date,sourceUpdatedAt:date,thumbnailUrl:image,galleryImages:image?[image]:[]});
            urls.add(canonical.toLowerCase());titles.add(tk);return true;
          }
          async function page(url){const r=await fetch(url,{headers,signal:AbortSignal.timeout(25000)});if(!r.ok)throw new Error("HTTP "+r.status);return await r.text();}
          async function scanCurseForge(){
            let added=0,empty=0;
            for(let n=1;n<=80&&added<3000;n++){
              const html=await page("https://www.curseforge.com/minecraft-bedrock/search?class=texture-packs&page="+n+"&pageSize=50&sortBy=latest+update&version=26.0");let matches=0,now=0;
              const re=/<a\b[^>]*href=["']([^"']*\/minecraft-bedrock\/texture-packs\/[^"'?#]+)["'][^>]*>([\s\S]*?)<\/a>/gi;
              for(const m of html.matchAll(re)){let u;try{u=new URL(m[1],"https://www.curseforge.com");}catch{continue;}if(u.hostname!=="www.curseforge.com"||u.pathname.split("/").filter(Boolean).length<3)continue;
                const frag=html.slice(Math.max(0,m.index-1800),Math.min(html.length,m.index+2600)),title=clean(m[2])||attr(m[2],"alt")||attr(m[2],"title");if(!title)continue;matches++;if(add("CurseForge",u.href,title,frag,"https://www.curseforge.com")){added++;now++;}if(added>=3000)break;}
              console.log("CurseForge",n,"matches",matches,"added",now);empty=now?0:empty+1;if(!matches||empty>=8)break;await new Promise(r=>setTimeout(r,180));
            }return added;
          }
          (async()=>{let added=0;try{added=await scanCurseForge();}catch(e){console.log("Additional source scan stopped:",e.message);}fs.writeFileSync(file,JSON.stringify(packs,null,2)+"\n");console.log(JSON.stringify({addedFromAdditionalSource:added,total:packs.length,cutoff:cutoff.toISOString().slice(0,10)},null,2));})().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Fetch public pack images
        run: |
          node <<'NODE'
          import fs from "node:fs";
          const path = "resource-packs.json";
          const packs = JSON.parse(fs.readFileSync(path, "utf8"));
          const headers = {
            "User-Agent": "Mozilla/5.0 (compatible; ResourcePackGalleryIndexer/1.0)",
            "Accept": "text/html,application/xhtml+xml"
          };
          const decode = s => String(s || "").replace(/&amp;/g, "&").replace(/&#038;/g, "&").replace(/&quot;/g, '"').replace(/&#39;|&#x27;/gi, "'");
          const attr = (tag, name) => {
            const m = tag.match(new RegExp("\\b" + name + "\\s*=\\s*(['\"])(.*?)\\1", "i"));
            return m ? decode(m[2]) : "";
          };
          function extractImages(html) {
            const found = [];
            for (const m of html.matchAll(/<meta\b[^>]*>/gi)) {
              const tag = m[0];
              const key = (attr(tag, "property") || attr(tag, "name")).toLowerCase();
              if (["og:image", "twitter:image", "twitter:image:src"].includes(key)) {
                const value = attr(tag, "content");
                if (value) found.push(value);
              }
            }
            for (const m of html.matchAll(/<img\\b[^>]*>/gi)) {
              const tag = m[0];
              const context = html.slice(Math.max(0, m.index - 650), Math.min(html.length, m.index + 650));
              const clues = (tag + " " + context).toLowerCase();
              if (/advert|advertisement|\\bad[sx]?\\b|sponsor|promot|banner|revenue|sale|become an author|explore modding|newsletter|subscribe|affiliate|tracking|pixel/.test(clues)) continue;
              if (/avatar|gravatar|profile|author-photo|user-photo|site-logo|brand-logo|social-icon|share-button/.test(clues)) continue;
              const value = attr(tag, "data-src") || attr(tag, "data-lazy-src") || attr(tag, "src");
              if (value) found.push(value);
              const srcset = attr(tag, "srcset");
              if (srcset) found.push(srcset.split(",")[0].trim().split(/\\s+/)[0]);
            }
            return [...new Set(found.map(raw => {
              try {
                const u = new URL(raw);
                if (u.protocol !== "https:" || !u.hostname.includes(".") || /\\.(svg)(?:$|\\?)/i.test(u.pathname)) return "";
                if (/gravatar|overwolf|avatar|logo|doubleclick|googlesyndication|adservice|adsystem/i.test(u.hostname + u.pathname)) return "";
                return u.href;
              } catch { return ""; }
            }).filter(Boolean))].slice(0, 20);
          }
          async function fetchOne(pack) {
            if (!/^https:\/\/(?:mcpedl\.com|www\.curseforge\.com|www\.planetminecraft\.com)\//i.test(pack.sourceUrl || "")) return { pack, images: [] };
            if (pack.imagesFetchedAt && pack.sourceUpdatedAt && pack.imagesFetchedAt >= pack.sourceUpdatedAt && (pack.galleryImages || []).length) return { pack, images: [] };
            try {
              const response = await fetch(pack.sourceUrl, { headers, signal: AbortSignal.timeout(12000) });
              if (!response.ok) throw new Error("HTTP " + response.status);
              const html = await response.text();
              return { pack, images: extractImages(html.slice(0, 5000000)) };
            } catch (error) {
              console.log("No image:", pack.title, error.message);
              return { pack, images: [] };
            }
          }
          (async () => {
            let updated = 0, totalImages = 0, failed = 0;
            const targets = packs.filter(p => /^https:\/\/(?:mcpedl\.com|www\.curseforge\.com|www\.planetminecraft\.com)\//i.test(p.sourceUrl || "") && !(p.imagesFetchedAt && p.sourceUpdatedAt && p.imagesFetchedAt >= p.sourceUpdatedAt && (p.galleryImages || []).length >= 4));
          console.log("Eligible packs for image enrichment:", targets.length, "of", packs.length);
            for (let i = 0; i < targets.length; i += 15) {
              const batch = await Promise.all(targets.slice(i, i + 15).map(fetchOne));
              for (const item of batch) {
                if (!item.images.length) { failed++; continue; }
                const combined = [...new Set([...(item.pack.galleryImages || []), ...item.images])].slice(0, 20);
                item.pack.thumbnailUrl = item.pack.thumbnailUrl || combined[0];
                item.pack.galleryImages = combined;
                item.pack.imagesFetchedAt = new Date().toISOString().slice(0, 10);
                updated++;
                totalImages += combined.length;
              }
            }
            fs.writeFileSync(path, JSON.stringify(packs, null, 2) + "\n");
            console.log(JSON.stringify({ scanned: targets.length, updated, totalImages, withoutImages: failed }, null, 2));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Collect full descriptions and pack metadata for in-site details
        run: |
          node <<'NODE'
          import fs from "node:fs";
          const file = "resource-packs.json";
          const packs = JSON.parse(fs.readFileSync(file, "utf8"));
          const headers = { "User-Agent": "Mozilla/5.0 (compatible; BedrockPackDirectory/3.0)", "Accept": "text/html,application/xhtml+xml" };
          const decode = s => String(s || "").replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;|&#x27;/g,"'").replace(/&nbsp;|&#160;/g," ").replace(/&#8217;|&#8216;/g,"'").replace(/&#8211;/g,"–").replace(/&#8212;/g,"—");
          const clean = s => decode(String(s || "").replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<style[\s\S]*?<\/style>/gi," ").replace(/<svg[\s\S]*?<\/svg>/gi," ").replace(/<[^>]+>/g," ")).replace(/\s+/g," ").trim();
          function meta(html,key){const re=new RegExp('<meta[^>]+(?:name|property)=["\\x27]'+key+'["\\x27][^>]+content=["\\x27]([^"\\x27]+)["\\x27]','i');return clean(html.match(re)?.[1]||"");}
          function jsonLd(html){for(const m of html.matchAll(/<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)){try{const v=JSON.parse(m[1]);const arr=Array.isArray(v)?v:[v];for(const x of arr){const a=x["@graph"]||[x];for(const y of a){if(y&&typeof y==="object"&&(y.description||y.author||y.datePublished||y.dateModified))return y;}}}catch{}}return {};}
          function articleText(html){const candidates=[...html.matchAll(/<(article|main|div)[^>]*(?:class|id)=["'][^"']*(?:entry-content|post-content|article-content|project-description|description|content-body|markdown-body)[^"']*["'][^>]*>([\s\S]*?)<\/\1>/gi)];let best="";for(const m of candidates){const t=clean(m[2]);if(t.length>best.length&&t.length<18000)best=t;}if(best.length<120){const desc=meta(html,"og:description")||meta(html,"description");return desc||best;}return best.slice(0,12000);}
          async function one(p){if(!/^https:\/\//i.test(p.sourceUrl||""))return false;if(p.fullDescription&&p.detailsFetchedAt&&p.detailsFetchedAt>=(p.sourceUpdatedAt||""))return false;try{const r=await fetch(p.sourceUrl,{headers,signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error("HTTP "+r.status);const html=(await r.text()).slice(0,5000000);const ld=jsonLd(html);const desc=articleText(html)||clean(ld.description)||meta(html,"og:description")||meta(html,"description");if(desc&&desc.length>30){if(/\\b(gun|guns|weapon|weapons|knife|knives|sword|swords|rifle|pistol|shotgun|grenade|ammo|ammunition|blade|crossbow|mace|spear)\\b/i.test(desc)){p.fullDescription="";p.detailsFiltered=true;}else{p.fullDescription=desc;p.detailsFiltered=false;}}const author=clean(typeof ld.author==="string"?ld.author:ld.author?.name);if(author&&!p.author)p.author=author.slice(0,120);if(ld.datePublished)p.publishedAt=String(ld.datePublished).slice(0,30);if(ld.dateModified)p.updatedAt=String(ld.dateModified).slice(0,30);p.detailsFetchedAt=new Date().toISOString().slice(0,10);return true;}catch(e){console.log("Details unavailable:",p.title,e.message);return false;}}
          async function run(){let updated=0,failed=0;const targets=packs.filter(p=>/^https:\/\//i.test(p.sourceUrl||"")&&(!p.fullDescription||!p.detailsFetchedAt||p.detailsFetchedAt<(p.sourceUpdatedAt||"")));console.log("Pages to inspect for details:",targets.length);for(let i=0;i<targets.length;i+=12){const results=await Promise.all(targets.slice(i,i+12).map(one));updated+=results.filter(Boolean).length;failed+=results.filter(x=>!x).length;console.log("Detail metadata",Math.min(i+12,targets.length),"/",targets.length,"updated",updated,"failed",failed);}fs.writeFileSync(file,JSON.stringify(packs,null,2)+"\n");console.log(JSON.stringify({targets:targets.length,updated,failed},null,2));}
          run().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Commit image index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource-packs.json
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Update resource pack gallery images"
            git push
          fi
