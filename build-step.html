<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft MapArt ブロック設置手順</title>
<style>
:root{color-scheme:dark;--bg:#181825;--panel:#1e1e2e;--card:#313244;--border:#45475a;--text:#cdd6f4;--muted:#a6adc8;--accent:#89b4fa}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--text);font:14px "Segoe UI","Hiragino Kaku Gothic ProN",sans-serif}
main{max-width:900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:14px}
h1{font-size:1.25rem;margin:0}
button,select{border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);padding:9px 12px;font-size:.9rem}
button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
#status{color:var(--muted);font-size:.85rem;white-space:pre-line;overflow-wrap:anywhere}
#status.error{color:#ff7777}
.progress{font-weight:700;margin:12px 0 6px}
.track{height:8px;border-radius:20px;background:var(--card);overflow:hidden}
.track>div{height:100%;width:0;background:var(--accent);transition:width .15s}
.settings{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.zoom-title{font-weight:700;margin:14px 0 8px}
.minimap-wrap{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin:10px 0 4px}
#miniMap{display:block;width:min(100%,256px);height:auto;aspect-ratio:1;border:1px solid var(--border);border-radius:6px;image-rendering:pixelated;background:var(--card)}
.minimap-legend{display:grid;gap:7px;color:var(--muted);font-size:.78rem;align-content:start}
.legend-item{display:flex;align-items:center;gap:7px}
.legend-swatch{width:13px;height:13px;border:1px solid #aaa;border-radius:3px;flex:none}
.legend-done{background:#555}.legend-current{background:#ffcf45}

.blocks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.block{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:5px}
.texture{width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#555}
.texture img{width:100%;height:100%;display:block;object-fit:cover;image-rendering:pixelated}
.col{font-weight:700;text-align:center;font-size:.9rem}
.coord{text-align:center;color:var(--muted);font-size:.78rem}
.name{text-align:center;overflow-wrap:anywhere;font-size:.82rem}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.controls button.primary{background:var(--accent);color:#15151d;border-color:var(--accent);font-weight:700}
@media(max-width:520px){body{padding:9px}.panel{padding:10px}.blocks{gap:5px}.block{padding:5px}.name{font-size:.72rem}.col{font-size:.78rem}.coord{font-size:.68rem}}
</style>
</head>
<body>
<main>
<header><h1>ブロック設置手順</h1><button id="copyUrl">この手順のURLをコピー</button></header>
<section class="panel">
<div id="status">設計図データを読み込んでいます…</div>
<div class="progress" id="progress">読み込み中…</div>
<div class="track"><div id="progressFill"></div></div>
<div class="zoom-title">ミニマップ（現在位置）</div>
<div class="minimap-wrap">
 <canvas id="miniMap" width="128" height="128" aria-label="128×128マスのミニマップ。設置済み範囲と現在位置を表示"></canvas>
 <div class="minimap-legend">
  <div class="legend-item"><span class="legend-swatch legend-done"></span>設置済み</div>
  <div class="legend-item"><span class="legend-swatch legend-current"></span>今置く4マス</div>
  <div id="miniMapPosition">現在位置：—</div>
</div>
<div class="settings"><label for="direction">2行目以降の進行方向</label><select id="direction"><option value="left">毎行、左端から右へ</option><option value="right">左右交互（2行目は右端から）</option></select></div>
<div class="zoom-title">今回置く4マス</div>
<div class="blocks" id="blocks"></div>
<div class="controls">
<button id="first" disabled>最初へ</button>
<button id="back" disabled>前へ</button>
<button id="skipRow" disabled>次の行へ（1行飛ばす）</button>
<button id="next" class="primary" disabled>次へ（4ブロック）</button>
</div>
</section>
</main>
<script src="mapart-shared.js"></script>
<script>
(() => {
"use strict";
const PALETTE=window.MAPART_SHARED.PALETTE;
const URL_BLOCK_IDS=window.MAPART_SHARED.URL_BLOCK_IDS;
const PALETTE_INDEX=new Map(PALETTE.map((b,i)=>[b.id,i]));
const SIZE=128, STEP=4, BASE="https://raw.githubusercontent.com/Mojang/bedrock-samples/15701fa9c13923f12662984c32c124327e40e3d3/resource_pack/";
const ALIASES={grass_block:"grass",snow_block:"snow",cobweb:"web",terracotta:"hardened_clay"};
const $=id=>document.getElementById(id);
const status=$("status"),progress=$("progress"),fill=$("progressFill"),blocks=$("blocks");
let indices=null,placed=0, direction="left", images=new Map(), progressKey="";
function bytesFromBase64(value){
 const normalized=value.replace(/-/g,"+").replace(/_/g,"/");
 const binary=atob(normalized+"=".repeat((4-normalized.length%4)%4));
 const bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
 return bytes;
}
async function decode(){
 const hash=location.hash.slice(1); progressKey="mapart_progress_"+(()=>{let h1=2166136261,h2=2246822519;for(let i=0;i<hash.length;i++){const c=hash.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2^c,3266489917);}return (h1>>>0).toString(36)+"_"+(h2>>>0).toString(36);})();
 const isV2=hash.startsWith("2d")||hash.startsWith("2p");
 const mode=isV2?hash[1]:hash[0];
 const encoded=isV2?hash.slice(2):hash.slice(1);
 if(!encoded||!["d","p"].includes(mode))throw new Error("URLに設計図データがありません。元のサイトで「設置手順を別タブで開く」を押してください。");
 let bytes=bytesFromBase64(encoded);
 if(mode==="d"){
  if(typeof DecompressionStream!=="function")throw new Error("このブラウザは圧縮URLの展開に対応していません。");
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  bytes=new Uint8Array(await new Response(stream).arrayBuffer());
 }
 if(bytes.length!==SIZE*SIZE+1)throw new Error("設計図データのサイズが正しくありません。URLが切れていないか確認してください。");
 direction=bytes[0]===1?"right":"left";
 $("direction").value=direction;
 try{const saved=JSON.parse(localStorage.getItem(progressKey)||"null");if(saved&&saved.direction===direction&&Number.isFinite(saved.placed))placed=Math.max(0,Math.min(SIZE*SIZE,Math.floor(saved.placed/STEP)*STEP));}catch(_){placed=0;}
 const raw=bytes.slice(1);
 if(isV2){
  indices=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++){
   const id=URL_BLOCK_IDS[raw[i]],index=PALETTE_INDEX.get(id);
   if(index===undefined)throw new Error("このURLに含まれるブロックIDに対応していません: "+id);
   indices[i]=index;
  }
 }else{
  // 旧URLは当時の配列番号で復元するため、PALETTEの既存要素の並び順を変更しないこと。
  indices=raw;
  for(const n of indices)if(n>=PALETTE.length)throw new Error("未対応のブロック番号が含まれています。");
 }
}
const texturePath=window.MAPART_SHARED.texturePathFromBlock;
async function loadTextures(){
 status.textContent="統合版のブロックテクスチャ情報を取得しています…";
 const used=[...new Set(indices)].map(i=>PALETTE[i]);
 try{
  const [blocksRes,terrainRes]=await Promise.all([
   window.MAPART_SHARED.fetchCachedText(BASE+"blocks.json"),
   window.MAPART_SHARED.fetchCachedText(BASE+"textures/terrain_texture.json")
  ]);
  const blockDefs=window.MAPART_SHARED.parseBedrockJson(blocksRes),terrainJson=window.MAPART_SHARED.parseBedrockJson(terrainRes),terrain=terrainJson.texture_data||{};
  let done=0,cursor=0;
  async function worker(){while(cursor<used.length){const item=used[cursor++];try{const path=texturePath(blockDefs[ALIASES[item.id]||item.id],terrain);if(path){const img=new Image();img.src=BASE+path;await img.decode();images.set(item.id,img);}}catch(error){console.warn("テクスチャ取得失敗、マップ色で代替:",item.id,error);}done++;status.textContent="ブロックテクスチャ読み込み中… "+done+" / "+used.length;}}
  await Promise.all(Array.from({length:Math.min(8,used.length)},()=>worker()));
 }catch(error){console.warn("テクスチャ情報を取得できません。マップ色で表示します。",error);}
 status.textContent="準備完了！テクスチャ未取得のブロックはマップ色で表示します。";
}
function position(order){
 const row=Math.floor(order/SIZE),offset=order%SIZE;
 const reverse=direction==="right"&&row%2===1;
 const x=reverse?SIZE-1-offset:offset;
 return {x,y:row,index:indices[row*SIZE+x]};
}
function draw(){
 const total=SIZE*SIZE,first=Math.min(placed,total),last=Math.min(first+STEP,total);
 progress.textContent=first>=total?"設置完了！ "+total.toLocaleString()+" / "+total.toLocaleString()+" 個":
  "設置済み "+first.toLocaleString()+" / "+total.toLocaleString()+" 個　・　次の4ブロック";
 fill.style.width=(first/total*100)+"%";
 blocks.replaceChildren();
 if(first>=total){
  const done=document.createElement("p");done.textContent="すべてのブロックを置き終わりました！";blocks.append(done);
 }else{
  for(let i=first;i<last;i++){
   const pos=position(i),item=PALETTE[pos.index],card=document.createElement("div");
   card.className="block";
   const texture=document.createElement("div");texture.className="texture";
   const img=images.get(item.id);
   if(img){const copy=document.createElement("img");copy.src=img.src;copy.alt=item.name;texture.append(copy);}
   else texture.style.background="rgb("+item.mapRgb.join(",")+")";
   const col=document.createElement("div");col.className="col";col.textContent=(pos.x+1).toLocaleString()+"列目";
   const coord=document.createElement("div");coord.className="coord";coord.textContent="行"+(pos.y+1);
   const name=document.createElement("div");name.className="name";name.textContent=item.name;
   card.append(texture,col,coord,name);blocks.append(card);
  }
 }
 drawMiniMap(first,last);
 $("first").disabled=first===0;
 $("back").disabled=first===0;
 $("skipRow").disabled=first>=total||Math.floor(first/SIZE+1)*SIZE>=total;
 $("next").disabled=first>=total;
 $("next").textContent=first+STEP>=total?"完了":"次へ（4ブロック）";
}
let miniMapBaseCanvas=null,miniMapDrawnPlaced=0,miniMapNeedsReset=true;
function prepareMiniMap(){
 if(miniMapBaseCanvas)return;
 miniMapBaseCanvas=document.createElement("canvas");miniMapBaseCanvas.width=SIZE;miniMapBaseCanvas.height=SIZE;
 const c=miniMapBaseCanvas.getContext("2d"),image=c.createImageData(SIZE,SIZE);
 for(let order=0;order<SIZE*SIZE;order++){const pos=position(order),item=PALETTE[pos.index],rgb=item.mapRgb||[100,100,100],o=(pos.y*SIZE+pos.x)*4;image.data[o]=rgb[0];image.data[o+1]=rgb[1];image.data[o+2]=rgb[2];image.data[o+3]=255;}
 c.putImageData(image,0,0);
}
function drawMiniMap(first,last){
 prepareMiniMap();const canvas=$("miniMap"),ctx=canvas.getContext("2d"),scale=canvas.width/SIZE;
 if(miniMapNeedsReset){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(miniMapBaseCanvas,0,0,canvas.width,canvas.height);miniMapDrawnPlaced=0;miniMapNeedsReset=false;}
 const from=Math.min(first,miniMapDrawnPlaced),to=Math.max(first,miniMapDrawnPlaced);
 for(let order=from;order<to;order++){const pos=position(order),x=pos.x*scale,y=pos.y*scale;if(order<first){ctx.fillStyle="rgba(0,0,0,.58)";ctx.fillRect(x,y,scale,scale);}else{ctx.drawImage(miniMapBaseCanvas,pos.x,pos.y,1,1,x,y,scale,scale);}}
 miniMapDrawnPlaced=first;
 ctx.lineWidth=1.2;ctx.strokeStyle="#ffffff";ctx.beginPath();
 for(let order=first;order<last;order++){const pos=position(order);ctx.rect(pos.x*scale+.5,pos.y*scale+.5,scale-1,scale-1);}ctx.stroke();
 if(first<SIZE*SIZE){const pos=position(first);ctx.lineWidth=2;ctx.strokeStyle="#ffcf45";ctx.strokeRect(pos.x*scale+1,pos.y*scale+1,scale-2,scale-2);$("miniMapPosition").textContent="現在位置："+(pos.x+1)+"列目・"+(pos.y+1)+"行目";}
 else $("miniMapPosition").textContent="現在位置：設置完了";
}
function setPosition(value){placed=Math.max(0,Math.min(SIZE*SIZE,Math.floor(value/STEP)*STEP));saveProgress();draw();}
$("first").addEventListener("click",()=>{if(placed>0&&!confirm("設置済みの進捗表示を最初に戻しますか？"))return;setPosition(0);});
$("back").addEventListener("click",()=>setPosition(placed-STEP));
$("next").addEventListener("click",()=>setPosition(placed+STEP));
$("skipRow").addEventListener("click",()=>setPosition(Math.ceil((placed+1)/SIZE)*SIZE));
$("direction").addEventListener("change",()=>{
 const next=$("direction").value;
 if(placed>0&&next!==direction){
  if(!confirm("設置方向を変更すると、現在の進捗と設置済み位置が一致しなくなります。進捗をリセットして変更しますか？")){
   $("direction").value=direction;return;
  }
  placed=0;
 }
 direction=next;saveProgress();miniMapNeedsReset=true;draw();
});
$("copyUrl").addEventListener("click",async()=>{
 try{await navigator.clipboard.writeText(location.href);status.textContent="この設置手順のURLをコピーしました。";}
 catch(_){status.textContent="URL欄からアドレスをコピーしてください。";}
});
(async()=>{try{await decode();await loadTextures();draw();}catch(e){status.className="error";status.textContent=e.message;progress.textContent="読み込みエラー";}})();
})();
</script>
</body>
</html>
