name: MapArt checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: node --check resource-packs.js
      - run: node --input-type=module --check < resource-packs-worker.js
      - run: node tests/check-inline-scripts.mjs
