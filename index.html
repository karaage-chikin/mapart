<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapArt 2D Generator (Texture Preview)</title>
  <style>
    :root {
      --bg: #181825;
      --panel: #1e1e2e;
      --card: #313244;
      --border: #45475a;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --accent: #89b4fa;
      --accent-hover: #b4befe;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0;
      font-size: 1.4rem;
    }
    .badge {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .grid-main {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
    }
    @media (max-width: 900px) {
      .grid-main { grid-template-columns: 1fr; }
    }
    .box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 16px;
    }
    .box h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      border-left: 4px solid var(--accent);
      padding-left: 8px;
    }
    .field {
      margin-bottom: 12px;
    }
    .field label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    input[type="file"], input[type="color"], select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.9rem;
    }
    select { width: 100%; }
    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }
    button {
      background: var(--accent);
      color: #11111b;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: var(--border); }
    .preset-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .block-list {
      max-height: 360px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      background: var(--bg);
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }
    .block-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 5px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .block-item:hover { background: var(--card); }
    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.4);
      flex-shrink: 0;
    }
    .canvas-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .canvas-card {
      background: var(--card);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .canvas-card h3 {
      margin: 0 0 8px;
      font-size: 0.95rem;
      color: var(--subtext);
    }
    canvas {
      width: 100%;
      max-width: 384px;
      aspect-ratio: 1 / 1;
      image-rendering: pixelated;
      background: #11111b;
      border: 2px solid var(--border);
      border-radius: 4px;
    }
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px;
      text-align: left;
    }
    th {
      color: var(--subtext);
      font-size: 0.82rem;
    }
    .muted {
      color: var(--subtext);
      font-size: 0.82rem;
    }
  </style>
</head>

      <div>

    function clamp(v, min = 0, max = 255) {
      return v < min ? min : v > max ? max : v;
    }

    function rgbToLab(r, g, b) {
      let sr = r / 255;
      let sg = g / 255;
      let sb = b / 255;

      sr = sr > 0.04045 ? Math.pow((sr + 0.055) / 1.055, 2.4) : sr / 12.92;
      sg = sg > 0.04045 ? Math.pow((sg + 0.055) / 1.055, 2.4) : sg / 12.92;
      sb = sb > 0.04045 ? Math.pow((sb + 0.055) / 1.055, 2.4) : sb / 12.92;

      let x = (sr * 0.4124 + sg * 0.3576 + sb * 0.1805) / 0.95047;
      let y = (sr * 0.2126 + sg * 0.7152 + sb * 0.0722) / 1.00000;
      let z = (sr * 0.0193 + sg * 0.1192 + sb * 0.9505) / 1.08883;

      x = x > 0.008856 ? Math.cbrt(x) : (7.787 * x) + 16 / 116;
      y = y > 0.008856 ? Math.cbrt(y) : (7.787 * y) + 16 / 116;
      z = z > 0.008856 ? Math.cbrt(z) : (7.787 * z) + 16 / 116;

      return [(116 * y) - 16, 500 * (x - y), 200 * (y - z)];
    }

    // ブロックごとの模様タイル（8x8）を事前生成
    function createBlockPatternCanvas(block, tilePx = 8) {
      const c = document.createElement("canvas");
      c.width = tilePx;
      c.height = tilePx;
      const ctx = c.getContext("2d");
      const [r, g, b] = block.rgb;

      const light = `rgba(${clamp(r + 28)}, ${clamp(g + 28)}, ${clamp(b + 28)}, 0.45)`;
      const dark = `rgba(${clamp(r - 32)}, ${clamp(g - 32)}, ${clamp(b - 32)}, 0.45)`;

      ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.fillRect(0, 0, tilePx, tilePx);

      const s = tilePx / 8;

      if (block.pattern === "wool") {
        // 羊毛風のクロス繊維
        ctx.strokeStyle = light;
        ctx.lineWidth = Math.max(1, s);
        for (let i = 0; i < 8; i += 2) {
          ctx.beginPath();
          ctx.moveTo(0, i * s + s * 0.5);
          ctx.lineTo(tilePx, i * s + s * 0.5);
          ctx.stroke();
        }
        ctx.strokeStyle = dark;
        for (let j = 1; j < 8; j += 2) {
          ctx.beginPath();
          ctx.moveTo(j * s + s * 0.5, 0);
          ctx.lineTo(j * s + s * 0.5, tilePx);
          ctx.stroke();
        }
      } else if (block.pattern === "planks") {
        // 板材風の横目と継ぎ目
        ctx.fillStyle = dark;
        ctx.fillRect(0, Math.floor(tilePx * 0.5), tilePx, Math.max(1, Math.round(s * 0.8)));
        ctx.fillRect(Math.floor(tilePx * 0.25), 0, Math.max(1, Math.round(s * 0.8)), Math.floor(tilePx * 0.5));
        ctx.fillRect(Math.floor(tilePx * 0.75), Math.floor(tilePx * 0.5), Math.max(1, Math.round(s * 0.8)), Math.ceil(tilePx * 0.5));
      } else if (block.pattern === "bricks") {
        // レンガ・タイル風の枠線
        ctx.strokeStyle = dark;
        ctx.lineWidth = Math.max(1, Math.round(s * 0.8));
        ctx.strokeRect(0.5, 0.5, tilePx - 1, tilePx - 1);
        ctx.fillStyle = light;
        ctx.fillRect(s, s, Math.max(1, tilePx - s * 2), Math.max(1, s));
      } else if (block.pattern === "speckle") {
        // 石・土・草風の砂目ノイズ
        for (let y = 0; y < 8; y++) {
          for (let x = 0; x < 8; x++) {
            const hash = ((x * 374761393 + y * 668265263 + block.rgb[0] * 1442695041) >>> 0) % 10;
            if (hash < 2) {
              ctx.fillStyle = dark;
              ctx.fillRect(x * s, y * s, Math.ceil(s), Math.ceil(s));
            } else if (hash > 7) {
              ctx.fillStyle = light;
              ctx.fillRect(x * s, y * s, Math.ceil(s), Math.ceil(s));
            }
          }
        }
      } else {
        // smooth（テラコッタ・粘土・氷などの微細な質感）
        ctx.fillStyle = light;
        ctx.fillRect(0, 0, tilePx, Math.max(1, Math.round(s * 0.7)));
        ctx.fillStyle = dark;
        ctx.fillRect(0, tilePx - Math.max(1, Math.round(s * 0.7)), tilePx, Math.max(1, Math.round(s * 0.7)));
      }

      return c;
    }

    BLOCK_DATA.forEach(b => {
      b.lab = rgbToLab(b.rgb[0], b.rgb[1], b.rgb[2]);
    });

    const els = {
      imageInput: document.getElementById("imageInput"),
      previewStyle: document.getElementById("previewStyle"),
      textureScale: document.getElementById("textureScale"),
      fitMode: document.getElementById("fitMode"),
      ditherStrength: document.getElementById("ditherStrength"),
      ditherStrengthVal: document.getElementById("ditherStrengthVal"),
      bgFillToggle: document.getElementById("bgFillToggle"),
      bgColorInput: document.getElementById("bgColorInput"),
      blockList: document.getElementById("blockList"),
      activeCountText: document.getElementById("activeCountText"),
      sourceCanvas: document.getElementById("sourceCanvas"),
      resultCanvas: document.getElementById("resultCanvas"),
      resultTitle: document.getElementById("resultTitle"),
      downloadPngBtn: document.getElementById("downloadPngBtn"),
      statsBody: document.querySelector("#statsTable tbody"),
      textureStatus: document.getElementById("textureStatus")
    };

    const srcCtx = els.sourceCanvas.getContext("2d");
    const resCtx = els.resultCanvas.getContext("2d");
    let loadedImage = null;
    let lastGrid = null;
    let patternCache = new Map();

    function rebuildPatternCache(tilePx) {
      patternCache.clear();
      BLOCK_DATA.forEach(b => {
        patternCache.set(b.id, b.textureImage || createBlockPatternCanvas(b, tilePx));
      });
    }

    // Mojang公式Bedrock Samplesのバニラ定義から、各ブロックの上面テクスチャを取得する。
    const BEDROCK_SAMPLE_BASE = "https://raw.githubusercontent.com/Mojang/bedrock-samples/main/resource_pack/";
    const BEDROCK_ID_ALIASES = {
      grass_block: "grass", snow_block: "snow", cobweb: "web"
    };

    function parseBedrockJson(text) {
      return JSON.parse(text.replace(/^\s*\/\/.*$/gm, ""));
    }

    function texturePathFromBlock(blockDef, terrainData) {
      if (!blockDef || !blockDef.textures) return null;
      let textureKey = typeof blockDef.textures === "string"
        ? blockDef.textures
        : (blockDef.textures.up || blockDef.textures.side || blockDef.textures.down);
      if (!textureKey) return null;
      const entry = terrainData[textureKey];
      if (!entry) return null;
      let value = entry.textures;
      if (Array.isArray(value)) value = value[0];
      if (value && typeof value === "object") value = value.path;
      if (typeof value !== "string") return null;
      return (value.startsWith("textures/") ? value : "textures/blocks/" + value) + ".png";
    }

    function loadTextureImage(path) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("画像を取得できません: " + path));
        img.src = BEDROCK_SAMPLE_BASE + path;
      });
    }

    function getTextureAverage(img) {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth || img.width;
      c.height = img.naturalHeight || img.height;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, c.width, c.height).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < data.length; i += 4) {
        const a = data[i + 3] / 255;
        if (a <= 0.05) continue;
        r += data[i] * a; g += data[i + 1] * a; b += data[i + 2] * a; n += a;
      }
      if (!n) return [0, 0, 0];
      return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
    }

    async function loadBedrockTextures() {
      if (els.textureStatus) els.textureStatus.textContent = "統合版のブロック定義・テクスチャ一覧を取得中…";
      try {
        const urls = [
          BEDROCK_SAMPLE_BASE + "blocks.json",
          BEDROCK_SAMPLE_BASE + "textures/terrain_texture.json"
        ];
        const responses = await Promise.all(urls.map(url => fetch(url)));
        if (responses.some(response => !response.ok)) throw new Error("公式サンプルのJSONを取得できませんでした。");
        const blockDefs = parseBedrockJson(await responses[0].text());
        const terrainJson = parseBedrockJson(await responses[1].text());
        const terrainData = terrainJson.texture_data || {};
        let loaded = 0, failed = 0;

        for (const block of BLOCK_DATA) {
          const realId = BEDROCK_ID_ALIASES[block.id] || block.id;
          const path = texturePathFromBlock(blockDefs[realId], terrainData);
          if (!path) { failed++; continue; }
          try {
            const img = await loadTextureImage(path);
            block.textureImage = img;
            block.texturePath = path;
            block.rgb = getTextureAverage(img);
            block.lab = rgbToLab(block.rgb[0], block.rgb[1], block.rgb[2]);
            loaded++;
          } catch (error) {
            failed++;
            console.warn("テクスチャ読み込み失敗:", block.id, path, error);
          }
        }

        rebuildPatternCache(Number(els.textureScale.value));
        renderBlockList();
        if (els.textureStatus) {
          els.textureStatus.textContent = loaded
            ? "統合版バニラテクスチャ読み込み完了：" + loaded + " / " + BLOCK_DATA.length + " 種（取得不可 " + failed + " 種は代替表示）"
            : "公式テクスチャを取得できませんでした。従来の代替プレビューで動作します。";
        }
        runConversion();
      } catch (error) {
        console.error(error);
        if (els.textureStatus) els.textureStatus.textContent =
          "公式テクスチャを取得できませんでした。ネット接続を確認してください（代替プレビューで動作中）。";
      }
    }

    function renderBlockList() {
      els.blockList.innerHTML = "";
      BLOCK_DATA.forEach((b, idx) => {
        const label = document.createElement("label");
        label.className = "block-item";
        label.innerHTML = `
          <input type="checkbox" data-idx="${idx}" ${b.checked ? "checked" : ""}>
          <span class="swatch" style="background: rgb(${b.rgb[0]},${b.rgb[1]},${b.rgb[2]});"></span>
          <span>${b.name}</span>
        `;
        label.querySelector("input").addEventListener("change", (e) => {
          BLOCK_DATA[idx].checked = e.target.checked;
          updateActiveCount();
          runConversion();
        });
        els.blockList.appendChild(label);
      });
      updateActiveCount();
    }

    function updateActiveCount() {
      const active = BLOCK_DATA.filter(b => b.checked).length;
      els.activeCountText.textContent = `有効ブロック: ${active} / ${BLOCK_DATA.length}`;
    }

    document.querySelectorAll("[data-preset]").forEach(btn => {
      btn.addEventListener("click", () => {
        const type = btn.dataset.preset;
        BLOCK_DATA.forEach(b => {
          if (type === "all") b.checked = true;
          else if (type === "none") b.checked = false;
          else if (type === "wool") b.checked = b.cat === "wool";
          else if (type === "terracotta") b.checked = b.cat === "terracotta";
          else if (type === "basic") b.checked = b.cat === "basic";
        });
        renderBlockList();
        runConversion();
      });
    });

    function drawFittedImage(img) {
      srcCtx.clearRect(0, 0, MAP_SIZE, MAP_SIZE);
      if (els.bgFillToggle.checked) {
        srcCtx.fillStyle = els.bgColorInput.value;
        srcCtx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);
      }

      const mode = els.fitMode.value;
      const iw = img.width;
      const ih = img.height;

      if (mode === "stretch") {
        srcCtx.drawImage(img, 0, 0, MAP_SIZE, MAP_SIZE);
      } else if (mode === "cover") {
        const side = Math.min(iw, ih);
        const sx = (iw - side) / 2;
        const sy = (ih - side) / 2;
        srcCtx.drawImage(img, sx, sy, side, side, 0, 0, MAP_SIZE, MAP_SIZE);
      } else if (mode === "contain") {
        const scale = Math.min(MAP_SIZE / iw, MAP_SIZE / ih);
        const dw = iw * scale;
        const dh = ih * scale;
        const dx = (MAP_SIZE - dw) / 2;
        const dy = (MAP_SIZE - dh) / 2;
        srcCtx.drawImage(img, dx, dy, dw, dh);
      }
    }

    function findClosestBlockLab(r, g, b, activeBlocks) {
      const [L1, a1, b1] = rgbToLab(clamp(r), clamp(g), clamp(b));
      let best = activeBlocks[0];
      let bestDist = Infinity;

      for (let i = 0; i < activeBlocks.length; i++) {
        const blk = activeBlocks[i];
        const dL = L1 - blk.lab[0];
        const da = a1 - blk.lab[1];
        const db = b1 - blk.lab[2];
        const dist = dL * dL + da * da + db * db;
        if (dist < bestDist) {
          bestDist = dist;
          best = blk;
        }
      }
      return best;
    }

    function addError(buf, size, x, y, er, eg, eb, weight) {
      if (x < 0 || x >= size || y < 0 || y >= size) return;
      const idx = (y * size + x) * 4;
      buf[idx] += er * weight;
      buf[idx + 1] += eg * weight;
      buf[idx + 2] += eb * weight;
    }

    function renderResultPreview() {
      if (!lastGrid) return;

      const style = els.previewStyle.value;
      const tilePx = Number(els.textureScale.value);

      if (style === "texture") {
        const outPx = MAP_SIZE * tilePx;
        els.resultCanvas.width = outPx;
        els.resultCanvas.height = outPx;
        els.resultTitle.textContent = `2D マップアート結果（ブロック模様 / ${tilePx}×${tilePx}px）`;

        if (patternCache.size === 0 || patternCache.values().next().value.width !== tilePx) {
          rebuildPatternCache(tilePx);
        }

        for (let y = 0; y < MAP_SIZE; y++) {
          for (let x = 0; x < MAP_SIZE; x++) {
            const blk = lastGrid[y * MAP_SIZE + x];
            const tile = patternCache.get(blk.id);
            resCtx.drawImage(tile, x * tilePx, y * tilePx, tilePx, tilePx);
          }
        }
      } else {
        els.resultCanvas.width = MAP_SIZE;
        els.resultCanvas.height = MAP_SIZE;
        els.resultTitle.textContent = "2D マップアート結果（単色 128×128）";

        const outImg = resCtx.createImageData(MAP_SIZE, MAP_SIZE);
        for (let i = 0; i < lastGrid.length; i++) {
          const blk = lastGrid[i];
          const idx = i * 4;
          outImg.data[idx] = blk.rgb[0];
          outImg.data[idx + 1] = blk.rgb[1];
          outImg.data[idx + 2] = blk.rgb[2];
          outImg.data[idx + 3] = 255;
        }
        resCtx.putImageData(outImg, 0, 0);
      }
    }

    function runConversion() {
      if (!loadedImage) return;

      const activeBlocks = BLOCK_DATA.filter(b => b.checked);
      if (activeBlocks.length === 0) {
        lastGrid = null;
        resCtx.clearRect(0, 0, els.resultCanvas.width, els.resultCanvas.height);
        els.statsBody.innerHTML = '<tr><td colspan="4" class="muted">ブロックを1種類以上選択してください。</td></tr>';
        return;
      }

      drawFittedImage(loadedImage);

      const srcImg = srcCtx.getImageData(0, 0, MAP_SIZE, MAP_SIZE);
      const work = new Float32Array(srcImg.data);
      const counts = new Map();
      const strength = Number(els.ditherStrength.value) / 100;
      const grid = new Array(MAP_SIZE * MAP_SIZE);

      for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
          const idx = (y * MAP_SIZE + x) * 4;
          const r = work[idx];
          const g = work[idx + 1];
          const b = work[idx + 2];

          const matched = findClosestBlockLab(r, g, b, activeBlocks);
          grid[y * MAP_SIZE + x] = matched;

          counts.set(matched.id, (counts.get(matched.id) || 0) + 1);

          if (strength > 0) {
            const er = (r - matched.rgb[0]) * strength;
            const eg = (g - matched.rgb[1]) * strength;
            const eb = (b - matched.rgb[2]) * strength;

            addError(work, MAP_SIZE, x + 1, y, er, eg, eb, 7 / 16);
            addError(work, MAP_SIZE, x - 1, y + 1, er, eg, eb, 3 / 16);
            addError(work, MAP_SIZE, x, y + 1, er, eg, eb, 5 / 16);
            addError(work, MAP_SIZE, x + 1, y + 1, er, eg, eb, 1 / 16);
          }
        }
      }

      lastGrid = grid;
      renderResultPreview();
      renderStats(counts);
    }

    function renderStats(counts) {
      const sorted = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]);
      els.statsBody.innerHTML = "";

      for (const [id, count] of sorted) {
        const blk = BLOCK_DATA.find(b => b.id === id);
        const stacks = Math.ceil(count / 64).toLocaleString();
        const doubleChests = Math.ceil(count / 3456).toLocaleString();

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="swatch" style="background: rgb(${blk.rgb[0]},${blk.rgb[1]},${blk.rgb[2]});"></span>
              <span>${blk.name}</span>
            </div>
          </td>
          <td>${count.toLocaleString()} 個</td>
          <td>${stacks} スタック分</td>
          <td>${doubleChests} LC分</td>
        `;
        els.statsBody.appendChild(tr);
      }
    }

    els.imageInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          runConversion();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    [els.fitMode, els.bgFillToggle, els.bgColorInput].forEach(el => {
      el.addEventListener("change", runConversion);
    });

    [els.previewStyle, els.textureScale].forEach(el => {
      el.addEventListener("change", () => {
        rebuildPatternCache(Number(els.textureScale.value));
        renderResultPreview();
      });
    });

    els.ditherStrength.addEventListener("input", () => {
      els.ditherStrengthVal.textContent = `${els.ditherStrength.value}%`;
      runConversion();
    });

    els.downloadPngBtn.addEventListener("click", () => {
      if (!lastGrid) return;
      const a = document.createElement("a");
      a.download = `mapart_2d_${els.previewStyle.value}.png`;
      a.href = els.resultCanvas.toDataURL("image/png");
      a.click();
    });

    rebuildPatternCache(Number(els.textureScale.value));
    renderBlockList();
    loadBedrockTextures();
  </script>
</body>
</html>
